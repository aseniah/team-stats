:root {

.controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-left: auto; }
.controls .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; justify-content: flex-end; }

.stage { position: relative; border-radius: 16px; padding: 18px 18px 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 500px;
  background: repeating-linear-gradient(90deg, var(--scene-stage) 0 64px, var(--scene-stage-stripe) 64px 128px);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 25%); }

.lane-name { font-family: var(--display); font-size: 17px; font-weight: 700; fill: var(--scene-label-text); }

.clock .pit-flag.on { opacity: 1; }

.timeline .day { display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 12px; font-weight: 600; color: var(--scene-day-text); border-right: 1px solid var(--scene-day-line); overflow: hidden; }

.timeline .marker { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--scene-marker); box-shadow: 0 0 6px color-mix(in srgb, var(--scene-marker) 60%, transparent); left: 0; }

.callout { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -10px); opacity: 0; pointer-events: none; z-index: 5;
  display: flex; align-items: stretch; background: var(--surface-1); color: var(--text-primary); border-radius: 8px; overflow: hidden;

.mini { display: block; flex: none; }

  background: color-mix(in srgb, var(--surface-0) 82%, transparent); backdrop-filter: blur(2px); z-index: 6; text-align: center; }
.overlay[hidden] { display: none; }
.overlay h2 { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; margin: 0; }
.overlay p { margin: 0; color: var(--text-secondary); }

.lineup { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.lineup span { display: inline-flex; align-items: center; gap: 8px; }
.gantry { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.go { font-family: var(--display); font-size: 26px; padding: 12px 48px; border-radius: 999px; background: #2bd96b; border: 1px solid #2bd96b; color: #06140e; font-weight: 800; cursor: pointer; }
.go:hover:not(:disabled) { filter: brightness(1.08); }

.count { font-family: var(--display); font-size: 54px; font-weight: 800; line-height: 1; min-height: 54px; }
.count.go-text { color: #1faa55; }

.podium { display: flex; align-items: end; gap: 14px; margin-top: 6px; }
.podium .step { width: 160px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.podium .cars { display: flex; gap: 6px; min-height: 23px; flex-wrap: wrap; justify-content: center; }
.podium .block { width: 100%; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.podium .p1 .block { height: 118px; background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 70%, var(--surface-1)), color-mix(in srgb, var(--gold) 30%, var(--surface-1))); }
.podium .p2 .block { height: 88px; background: linear-gradient(180deg, color-mix(in srgb, var(--silver) 70%, var(--surface-1)), color-mix(in srgb, var(--silver) 30%, var(--surface-1))); }
.podium .p3 .block { height: 64px; background: linear-gradient(180deg, color-mix(in srgb, var(--bronze) 70%, var(--surface-1)), color-mix(in srgb, var(--bronze) 30%, var(--surface-1))); }
.podium .medal { font-size: 28px; }
.podium .empty { opacity: .35; }
.podium .empty .name { color: var(--text-muted); }
.podium .name { font-family: var(--display); font-weight: 800; font-size: 20px; }
.podium .num { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--text-primary); }
.others { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; color: var(--text-secondary); font-family: var(--display); font-size: 17px; font-weight: 600; }
.standings { display: flex; flex-direction: column; gap: 4px; font-family: var(--display); font-size: 20px; font-weight: 700; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

.log-wrap { margin-top: 14px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
.log-wrap summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--text-secondary); }
.log-wrap summary:hover { color: var(--text-primary); }
.log { padding: 0 14px 10px; max-height: 220px; overflow: auto; font-size: 13px; color: var(--text-secondary); }
.log div { padding: 2px 0; }
.log b { color: var(--text-primary); }
.stage.paused::after { content: "Paused"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
  background: var(--surface-1); color: var(--text-primary); font-family: var(--display); font-weight: 800; font-size: 34px; padding: 10px 28px; border-radius: 10px; box-shadow: 0 12px 30px rgb(0 0 0 / 35%); }
.empty-race { padding: 60px 16px; text-align: center; color: var(--scene-text); font-family: var(--display); font-size: 22px; }
@media (max-width: 640px) {
  .controls { align-items: stretch; margin-left: 0; }
  .controls .row { justify-content: flex-start; }
  .callout .cap, .callout.big .cap { font-size: 16px; }
  .podium .step { width: 100px; }
  .clock .when { min-width: 0; font-size: 15px; }
  .clock .pit-flag { display: none; }
}

// The build inlines this file into both pages by stripping `export `, so it must stay import-free.

const SERIES = Array.from({ length: 10 }, (_, i) => `--series-${i + 1}`);
const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };
const COLOR_MODES = ["auto", "light", "dark"];
const MODE_ICONS = {
  auto: '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" class="fill"/></svg>',
  light:
    '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>',
  dark: '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>',
};

const STORE_KEY = "teamstats.v2";
const store = {
  get() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    } catch {
      return {};
    }
  },
  set(v) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...store.get(), ...v }));
    } catch {
      /* storage unavailable */
    }
  },
};

function applyColorMode(mode) {
  if (mode === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
}

function modeButtonHtml(mode) {
  return `${MODE_ICONS[mode]}<span>${mode[0].toUpperCase()}${mode.slice(1)}</span>`;
}

const esc = (s) =>
  String(s ?? "").replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const memberLabel = (m) => m.displayName || m.name.split(" ")[0];
const initials = (m) =>
  (m.displayName
    ? m.displayName.slice(0, 2)
    : m.name
        .split(" ")
        .map((w) => w[0])
        .join("")
        .slice(0, 2)
  ).toUpperCase();

const decode = (s) => {
  try {
    return decodeURIComponent(s);
  } catch {
    return s;
  }
};

// `#team/period`. A single segment may be a team id or, from links made before teams existed, a period id.
function parseHash(raw) {
  const s = String(raw ?? "").replace(/^#/, "");
  if (!s) return { teamId: null, periodId: null };
  const i = s.indexOf("/");
  if (i < 0) return { teamId: decode(s), periodId: decode(s) };
  return {
    teamId: decode(s.slice(0, i)) || null,
    periodId: decode(s.slice(i + 1)) || null,
  };
}

function resolveSelection(teams, { teamId, periodId }, savedTeamId) {
  const byId = (id) => teams.find((t) => t.id === id);
  const hashTeam = byId(teamId);
  const team = hashTeam || byId(savedTeamId) || teams[0] || null;
  const single = teamId !== null && teamId === periodId;
  const pid = single && hashTeam ? null : periodId;
  return {
    team,
    periodId: team?.periods.some((p) => p.id === pid) ? pid : null,
  };
}

function hashFor(teamId, periodId) {
  return `#${encodeURIComponent(teamId)}${periodId ? `/${encodeURIComponent(periodId)}` : ""}`;
}

// Nav links carry only the team, so each report opens on its own default sprint.
function topBarHtml({ reports, current, teams, teamId, mode }) {
  const nav = reports
    .map(
      (r) =>
        `<a href="${esc(r.href)}${hashFor(teamId)}"${r.id === current ? ' aria-current="page"' : ""}>${esc(r.title)}</a>`,
    )
    .join("");
  const team = teams.find((t) => t.id === teamId);
  const picker =
    teams.length > 1
      ? `<label class="team-picker"><span class="visually-hidden">Team</span><select id="ctl-team">${teams.map((t) => `<option value="${esc(t.id)}"${t.id === teamId ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>`
      : `<span class="team-name">${esc(team?.name ?? "")}</span>`;
  return `<div class="topbar-inner">
    <a class="brand" href="${esc(reports[0]?.href ?? "#")}${hashFor(teamId)}"><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="8" width="3.4" height="6.5" rx="1"/><rect x="6.3" y="3" width="3.4" height="11.5" rx="1"/><rect x="11.1" y="5.5" width="3.4" height="9" rx="1"/></svg>TeamStats</a>
    <nav class="nav" aria-label="Reports">${nav}</nav>
    <div class="topbar-tools">${picker}<button type="button" id="ctl-mode" class="theme-toggle" title="Color mode: ${mode}. Click to change." aria-label="Color mode: ${mode}">${modeButtonHtml(mode)}</button></div>
  </div>`;
}

// Renders the bar into `el` and wires it. `onMode` runs after the mode is applied and saved.
function mountTopBar(el, opts, { onTeam, onMode }) {
  el.innerHTML = topBarHtml(opts);
  el.querySelector("#ctl-team")?.addEventListener("change", (e) =>
    onTeam(e.target.value),
  );
  el.querySelector("#ctl-mode").addEventListener("click", () => {
    const mode =
      COLOR_MODES[(COLOR_MODES.indexOf(opts.mode) + 1) % COLOR_MODES.length];
    store.set({ theme: mode });
    applyColorMode(mode);
    mountTopBar(el, { ...opts, mode }, { onTeam, onMode });
    el.querySelector("#ctl-mode").focus();
    onMode?.(mode);
  });
}

const savedMode = () =>
  COLOR_MODES.includes(store.get().theme) ? store.get().theme : "auto";

const AXIS_STEPS = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000];

// Smallest step that covers `v` in at most 5 gridlines, so the axis grows by 25 rather than doubling.
function niceScale(v) {
  const step =
    AXIS_STEPS.find((s) => Math.ceil(v / s) <= 5) ?? AXIS_STEPS.at(-1);
  const ticks = Math.max(1, Math.ceil(v / step));
  return step === 1 && ticks < 5
    ? { max: 5, ticks: 5 }
    : { max: ticks * step, ticks };
}

// The build inlines this file into the page by stripping `export `, so it must stay import-free.

const ms = (iso) => Date.parse(iso);

function effectivePeriods(periods, now) {
  const sorted = [...periods].sort((a, b) => ms(a.start) - ms(b.start));
  return sorted.map((p, i) => {
    const next = sorted[i + 1];
    return {
      ...p,
      end: next ? next.start : now.toISOString(),
      inProgress: !next,
    };
  });
}

function assignPeriod(at, eff) {
  const t = ms(at);
  const p = eff.find((x) => ms(x.start) <= t && t < ms(x.end));
  return p ? p.id : null;
}

function classifyEvent(ev, pr) {
  const t = ms(ev.at);
  if (pr.mergedAt && t > ms(pr.mergedAt)) return "after-merge";
  if (ev.state === "COMMENTED" && !ev.hasBody && ev.inlineComments <= 1)
    return "inline-comment";
  return null;
}

function memberWindow(m) {
  return {
    from: m.from ? ms(m.from) : -Infinity,
    to: m.to ? ms(m.to) : Infinity,
  };
}

function inWindow(t, w) {
  return w.from <= t && t < w.to;
}

function countByPeriod(events, members, eff) {
  const byLogin = new Map();
  for (const m of members)
    byLogin.set(m.github, [
      ...(byLogin.get(m.github) ?? []),
      { m, w: memberWindow(m) },
    ]);
  const result = {};
  for (const p of eff) {
    result[p.id] = {};
    for (const m of members) {
      const w = memberWindow(m);
      const overlaps = w.from < ms(p.end) && ms(p.start) < w.to;
      result[p.id][m.id] = overlaps ? { count: 0, reviews: 0, prs: [] } : null;
    }
  }
  const seen = new Map();
  const sorted = [...events].sort((a, b) => ms(a.at) - ms(b.at));
  for (const e of sorted) {
    if (e.excluded) continue;
    const m = byLogin.get(e.login)?.find((x) => inWindow(ms(e.at), x.w))?.m;
    if (!m) continue;
    const pid = assignPeriod(e.at, eff);
    const cell = pid && result[pid][m.id];
    if (!cell) continue;
    const key = `${e.repo}#${e.pr}`;
    const seenKey = `${pid}|${m.id}|${key}`;
    let entry = seen.get(seenKey);
    if (!entry) {
      entry = {
        key,
        url: e.url,
        title: e.prTitle,
        repo: e.repo,
        pr: e.pr,
        firstAt: e.at,
        reviewAts: [],
      };
      seen.set(seenKey, entry);
      cell.prs.push(entry);
      cell.count++;
    }
    entry.reviewAts.push(e.at);
    cell.reviews++;
  }
  return result;
}

function rankMembers(cells) {
  const sorted = [...cells].sort(
    (a, b) =>
      b.score - a.score || String(a.memberId).localeCompare(String(b.memberId)),
  );
  const ranked = sorted.map((c) => ({
    ...c,
    place: 1 + sorted.filter((o) => o.score > c.score).length,
  }));
  const maxPlace = Math.max(0, ...ranked.map((r) => r.place));
  return ranked.map((r) => ({
    ...r,
    last: maxPlace > 3 && r.place === maxPlace,
  }));
}

function utcDay(t) {
  return new Date(t).toISOString().slice(0, 10);
}

function dailyCumulative(events, members, period) {
  const counts = countByPeriod(events, members, [period]);
  const start = ms(period.start);
  const end = ms(period.end);
  const days = [];
  for (let d = Date.parse(utcDay(start)); d < end; d += 86_400_000)
    days.push(utcDay(d));
  const out = {};
  for (const m of members) {
    const cell = counts[period.id][m.id];
    if (!cell) continue;
    const perDay = new Map();
    for (const at of cell.prs.flatMap((pr) => pr.reviewAts))
      perDay.set(utcDay(ms(at)), (perDay.get(utcDay(ms(at))) || 0) + 1);
    let total = 0;
    out[m.id] = days.map((day) => ({
      day,
      total: (total += perDay.get(day) || 0),
    }));
  }
  return out;
}

function periodStatus(period, now, refreshedAt) {
  if (!period.inProgress) return { state: "final", clockEnd: period.end };
  const state =
    period.plannedEnd && now.getTime() >= ms(period.plannedEnd)
      ? "provisional"
      : "live";
  const clockEnd = refreshedAt
    ? new Date(Math.min(ms(period.end), ms(refreshedAt))).toISOString()
    : period.end;
  return { state, clockEnd };
}

function latestFinishedPeriod(eff, now) {
  return [...eff]
    .reverse()
    .find((p) => periodStatus(p, now, null).state !== "live");
}

function lastPlaceMark(team) {
  const mark = String(team.lastPlaceEmoji ?? "").trim();
  return mark || null;
}

<script>
// The build inlines this file into the race page by stripping `export `, so it must stay import-free.

const HOUR = 3_600_000;

const RACE = {
  raceMs: 60_000,
  weekendSpeed: 2,
  surgeShare: 0.7,
  speedFadeMs: 8 * HOUR,
  queueDrainMs: 6 * HOUR,
  cruisePerMs: 1 / (3 * HOUR),
  boostN: 4,
  boostWindowMs: HOUR,
  boostPaceFadeMs: 1.5 * HOUR,
  boostOffPerHour: 1.5,
  boostRearmMs: 2 * HOUR,
  boostMinMs: 2800,
  tieHoldMs: 3 * HOUR,
  tieRepeatMs: 24 * HOUR,
  passCooldownMs: 4000,
  frameClampMs: 64,
  drawSmoothMs: 250,
  crossSmoothMs: 220,
  runoutMinRate: (2 * 6 * HOUR) / 3000,
};

function placesBy(items, score) {
  return new Map(
    items.map((x) => [x, 1 + items.filter((o) => score(o) > score(x)).length]),
  );
}

function calendarDays(startMs, endMs) {
  const days = [];
  const d = new Date(startMs);
  d.setHours(0, 0, 0, 0);
  while (d.getTime() < endMs) {
    const t = d.getTime();
    d.setDate(d.getDate() + 1);
    days.push([t, d.getTime()]);
  }
  return days;
}

function clockRate(startMs, endMs, isWeekend) {
  let weekendMs = 0;
  for (const [a, b] of calendarDays(startMs, endMs)) {
    if (isWeekend(a)) weekendMs += Math.min(b, endMs) - Math.max(a, startMs);
  }
  const span = endMs - startMs;
  return (
    Math.max(1, span - weekendMs + weekendMs / RACE.weekendSpeed) / RACE.raceMs
  );
}

function createRace({
  racers,
  start: startMs,
  end,
  scaleEnd,
  isWeekend,
}) {
  const rs = racers.map((r) => ({
    id: r.id,
    times: [...r.times].sort((a, b) => a - b),
    joinAt: r.joinAt ?? null,
    leaveAt: r.leaveAt ?? null,
    final: r.times.length,
    target: 0,
    shownDist: 0,
    drawDist: 0,
    v: 0,
    pace: 0,
    boost: false,
    boostAt: null,
    boostOffAt: null,
    joined: r.joinAt == null || r.joinAt <= startMs,
    left: r.leaveAt != null && r.leaveAt <= startMs,
    crossTarget: null,
  }));
  return {
    phase: "grid",
    start: startMs,
    end,
    simT: startMs,
    isWeekend,
    rate: clockRate(startMs, Math.max(end, scaleEnd ?? end), isWeekend),
    finishDist: Math.max(1, ...rs.map((r) => r.final)),
    racers: rs,
    order: [...rs],
    pairLeader: new Map(),
    pairAt: new Map(),
    passedBy: new Set(),
    tieSince: new Map(),
    tieAnnouncedAt: new Map(),
    tied: new Set(),
    weekendSeen: new Set(),
  };
}

function start(race) {
  race.phase = "race";
  return [{ type: "start", t: race.simT }];
}

function drivenOf(r) {
  return Math.max(0, Math.ceil(Math.min(r.final, r.shownDist) - 0.05));
}

const recentCount = (r, T) =>
  r.times.filter((t) => t <= T && T - t < RACE.boostWindowMs).length;

function arrive(race, events) {
  for (const r of race.racers) {
    if (!r.joined && r.joinAt !== null && race.simT >= r.joinAt) {
      r.joined = true;
      events.push({ type: "join", a: r.id, t: race.simT });
    }
    if (!r.left && r.leaveAt !== null && race.simT >= r.leaveAt) {
      r.left = true;
      events.push({ type: "leave", a: r.id, t: race.simT });
    }
    while (r.target < r.times.length && r.times[r.target] <= race.simT) {
      const t = r.times[r.target++];
      r.v += RACE.surgeShare / RACE.speedFadeMs;
      r.pace += 1 / RACE.boostPaceFadeMs;
      if (race.isWeekend(t)) {
        const key = `${r.id}|${new Date(t).toDateString()}`;
        if (!race.weekendSeen.has(key)) {
          race.weekendSeen.add(key);
          events.push({ type: "weekend", a: r.id, day: t, t });
        }
      }
    }
  }
}

function drive(race, dt, simDt, nowMs, events) {
  const fade = Math.exp(-simDt / RACE.speedFadeMs);
  const paceFade = Math.exp(-simDt / RACE.boostPaceFadeMs);
  const smooth = 1 - Math.exp(-dt / RACE.drawSmoothMs);
  for (const r of race.racers) {
    if (r.crossTarget !== null) {
      r.shownDist +=
        (r.crossTarget - r.shownDist) *
        (1 - Math.exp(-dt / RACE.crossSmoothMs));
      r.drawDist = r.shownDist;
      r.boost = r.crossTarget - r.shownDist > 0.5;
      continue;
    }
    const queue = r.target - r.shownDist;
    if (queue > 0)
      r.shownDist = Math.min(
        r.target,
        r.shownDist +
          Math.max(r.v, queue / RACE.queueDrainMs, RACE.cruisePerMs) * simDt,
      );
    r.drawDist += (r.shownDist - r.drawDist) * smooth;
    r.v *= fade;
    r.pace *= paceFade;
    const rested = race.simT - (r.boostOffAt ?? -Infinity) >= RACE.boostRearmMs;
    const holding =
      r.boost &&
      (nowMs - r.boostAt < RACE.boostMinMs ||
        r.pace * HOUR >= RACE.boostOffPerHour);
    const boosting =
      race.phase === "race" &&
      (r.boost ? holding : rested && recentCount(r, race.simT) >= RACE.boostN);
    if (r.boost && !boosting) r.boostOffAt = race.simT;
    if (boosting && !r.boost) {
      r.boostAt = nowMs;
      events.push({ type: "boost", a: r.id, t: race.simT });
    }
    r.boost = boosting;
  }
}

function detectPasses(race, nowMs, events) {
  const next = [...race.order].sort((a, b) => drivenOf(b) - drivenOf(a));
  race.order = next;
  if (!next.length) return;
  const pairKey = (a, b) => [a.id, b.id].sort().join("|");
  if (next[0].shownDist < 3) {
    next.forEach((a, i) =>
      next.slice(i + 1).forEach((b) => race.pairLeader.set(pairKey(a, b), a)),
    );
    return;
  }
  const places = placesBy(race.racers, drivenOf);
  for (let i = 0; i + 1 < next.length; i++) {
    const ahead = next[i];
    const behind = next[i + 1];
    const key = pairKey(ahead, behind);
    const cooling =
      nowMs - (race.pairAt.get(key) ?? -Infinity) < RACE.passCooldownMs;
    if (drivenOf(ahead) === drivenOf(behind)) {
      if (!race.tieSince.has(key)) race.tieSince.set(key, race.simT);
      const held = race.simT - race.tieSince.get(key) >= RACE.tieHoldMs;
      const fresh =
        race.simT - (race.tieAnnouncedAt.get(key) ?? -Infinity) >=
        RACE.tieRepeatMs;
      if (
        drivenOf(ahead) > 0 &&
        held &&
        fresh &&
        places.get(ahead) <= 3 &&
        !race.tied.has(key) &&
        !cooling
      ) {
        race.tied.add(key);
        race.tieAnnouncedAt.set(key, race.simT);
        race.pairAt.set(key, nowMs);
        events.push({
          type: "tie",
          a: ahead.id,
          b: behind.id,
          place: places.get(ahead),
          t: race.simT,
        });
      }
      continue;
    }
    race.tied.delete(key);
    race.tieSince.delete(key);
    if (race.pairLeader.get(key) === ahead || cooling) continue;
    race.pairLeader.set(key, ahead);
    race.pairAt.set(key, nowMs);
    const back = race.passedBy.has(`${ahead.id}<${behind.id}`);
    race.passedBy.add(`${behind.id}<${ahead.id}`);
    events.push({
      type: i === 0 ? "lead" : "pass",
      a: ahead.id,
      b: behind.id,
      place: places.get(ahead),
      back,
      t: race.simT,
    });
  }
}

function step(race, realDtMs, nowMs) {
  const events = [];
  if (race.phase === "grid" || race.phase === "done") return events;
  const dt = Math.min(RACE.frameClampMs, Math.max(0, realDtMs));
  let simDt = 0;
  if (race.phase === "race") {
    const before = race.simT;
    race.simT = Math.min(
      race.end,
      race.simT +
        dt * race.rate * (race.isWeekend(race.simT) ? RACE.weekendSpeed : 1),
    );
    simDt = race.simT - before;
    arrive(race, events);
    if (race.simT >= race.end) {
      race.phase = "runout";
      events.push({
        type: "timeUp",
        t: race.simT,
        queued: race.racers.some((r) => r.target - r.shownDist > 0.5),
      });
    }
  } else if (race.phase === "runout") {
    simDt = dt * Math.max(race.rate, RACE.runoutMinRate);
  }
  drive(race, dt, simDt, nowMs, events);
  if (race.phase === "race" || race.phase === "runout")
    detectPasses(race, nowMs, events);
  if (
    race.phase === "runout" &&
    race.racers.every((r) => r.target - r.shownDist < 0.02)
  ) {
    race.phase = "ceremony";
    events.push({ type: "ceremony", t: race.simT });
  }
  return events;
}

function skip(race) {
  if (race.phase !== "race" && race.phase !== "runout") return;
  race.simT = race.end;
  race.phase = "runout";
  for (const r of race.racers) {
    r.target = r.final;
    r.shownDist = r.final;
    r.drawDist = r.final;
    r.v = 0;
    r.pace = 0;
    r.boost = false;
    r.joined = r.joinAt === null || r.joinAt <= race.end;
    r.left = r.leaveAt !== null && r.leaveAt <= race.end;
  }
  race.order = [...race.racers].sort((a, b) => b.final - a.final);
  race.racers.forEach((a, i) =>
    race.racers.slice(i + 1).forEach((b) => {
      race.pairLeader.set(
        [a.id, b.id].sort().join("|"),
        a.final >= b.final ? a : b,
      );
    }),
  );
}

function ceremonyGroups(race) {
  const places = placesBy(race.racers, (r) => r.final);
  const distinct = [...new Set(race.racers.map((r) => places.get(r)))].sort(
    (a, b) => a - b,
  );
  const lastPlace = Math.max(0, ...distinct);
  return distinct.map((place) => ({
    place,
    last: lastPlace > 3 && place === lastPlace,
    zero: race.racers.some((r) => places.get(r) === place && r.final === 0),
    ids: race.racers.filter((r) => places.get(r) === place).map((r) => r.id),
  }));
}

        <path d="M25,5 L25,8.5 M29,5 L29,8.5 M33,5 L33,8.5" stroke="${color}" stroke-width="1.4"/>
        <circle cx="29" cy="2" r="4.6" fill="#f1c9a5"/>

        <text x="25" y="17" font-size="8" font-weight="800" fill="${ink}" text-anchor="middle" font-family="var(--display)">${esc(initials)}</text></g>`;
    },
    field({ width, top, lanes, laneHeight, labelWidth, startX, finishX }) {
      const bottom = top + lanes * laneHeight;
      const left = labelWidth + 10;
      const edge = (y) => {
        const parts = [];
        for (let x = left, i = 0; x < width - 10; x += 16, i++)
          parts.push(
            `<rect x="${x}" y="${y}" width="16" height="5" fill="var(--scene-edge-${i % 2 ? "b" : "a"})"/>`,
          );
        return parts.join("");
      };
      const rows = [];
      for (let i = 0; i < lanes; i++) {
        const y = top + i * laneHeight;
        rows.push(
          `<rect x="${left}" y="${y}" width="${width - left - 10}" height="${laneHeight}" fill="var(--scene-ground)"/>`,
        );
        rows.push(
          `<path d="M${left},${y + laneHeight - 14} Q${(left + width) / 2},${y + laneHeight - 20} ${width - 10},${y + laneHeight - 14}" stroke="var(--scene-lane-line)" stroke-width="1" opacity=".35" fill="none"/>`,
        );
        if (i)
          rows.push(
            `<line x1="${left}" x2="${width - 10}" y1="${y}" y2="${y}" stroke="var(--scene-lane-line)" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>`,
          );
      }
      const flakes = [];
      for (let k = 0; k < 26; k++) {
        const x = (k * 197) % width;
        const y = ((k * 89) % (bottom + 10 - (top - 30))) + top - 30;
        if (x > labelWidth + 4 || y < top - 12)
          flakes.push(
            `<circle cx="${x}" cy="${y}" r="${1 + (k % 3)}" fill="var(--scene-flake)"/>`,
          );
      }
      const banner = [];
      for (let y = top, i = 0; y < bottom; y += 10, i++)
        banner.push(
          `<rect x="${finishX}" y="${y}" width="16" height="${Math.min(10, bottom - y)}" fill="${i % 2 ? "#d6453d" : "var(--scene-banner-light)"}"/>`,
        );
      return `<rect x="0" y="${top - 10}" width="${labelWidth + 2}" height="${lanes * laneHeight + 20}" rx="10" fill="var(--scene-pitwall)"/>
        <rect x="${labelWidth + 6}" y="${top - 9}" width="${width - labelWidth - 12}" height="${lanes * laneHeight + 18}" rx="6" fill="var(--scene-ground-edge)"/>
        ${rows.join("")}${edge(top - 5)}${edge(bottom)}
        <line x1="${startX}" x2="${startX}" y1="${top}" y2="${bottom}" stroke="var(--scene-start-line)" stroke-width="3"/>
        ${banner.join("")}
        <path d="M${finishX - 4},${top - 4} L${finishX - 4},${top - 26} M${finishX + 20},${top - 4} L${finishX + 20},${top - 26}" stroke="#7a5a3a" stroke-width="3"/>
        <rect x="${finishX - 8}" y="${top - 30}" width="32" height="9" rx="2" fill="#d6453d"/>
        ${flakes.join("")}`;
    },
    effects: {

        <path d="M-34,8 L-10,8 M-40,14 L-14,14 M-32,20 L-12,20" stroke="#3f78b0" stroke-width="2" stroke-linecap="round" opacity=".75"/>
        <path d="M4,26 Q-8,16 -30,20 Q-18,25 -32,30 Q-14,31 4,32 Z" fill="#dcebf7" stroke="#5b8dbd" stroke-width="1.6" stroke-linejoin="round"/>
        <g fill="#dcebf7" stroke="#5b8dbd" stroke-width="1.2"><circle cx="-20" cy="15" r="2.8"/><circle cx="-36" cy="25" r="2.4"/><circle cx="-26" cy="35" r="2.2"/><circle cx="-10" cy="12" r="2"/></g>
      </g>`,

    palette: { light: day, dark: night },

})();

</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const boardHref =
    DATA.reports.find((r) => r.id === "pr-reviews")?.href ?? "pr-reviews.html";
  let team, members, refreshedAt, eff, counts, fallback, LAST;
  const THEMES = window.RACE_THEMES || {};
  const icon = (d) =>
    `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">${d}</svg>`;
  const ICONS = {
    pause: icon(
      '<rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/>',
    ),
    play: icon(
      '<path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z" fill="currentColor"/>',
    ),
    restart: icon(
      '<path d="M3.2 8a4.8 4.8 0 1 0 1.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2.6 1.9v3.4H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    ),
    skip: icon(
      '<path d="M2.5 3.2v9.6a.5.5 0 0 0 .8.4L9.6 8.4a.5.5 0 0 0 0-.8L3.3 2.8a.5.5 0 0 0-.8.4z" fill="currentColor"/><rect x="11" y="2.5" width="2.5" height="11" rx="1" fill="currentColor"/>',
    ),
  };

  const fill = (tpl, v) =>
    String(tpl).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
  const pick = (arr, i) => arr[i % arr.length];
  const ordinal = (n) =>
    `${n}${({ 1: "st", 2: "nd", 3: "rd" })[n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || "th"}`;
  const WHEN = new Intl.DateTimeFormat(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
  });
  const fmtWhen = (t) => WHEN.format(t);
  const fmtDay = (t) =>
    new Date(t).toLocaleDateString(undefined, {
      month: "short",
      day: "numeric",
    });
  const fmtAgo = (iso) =>
    new Date(iso).toLocaleString(undefined, {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
    });
  const isWeekend = (t) => [0, 6].includes(new Date(t).getDay());
  const cssVar = (name) =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const BUBBLE_MS = 2800;
  const BANNER_MS = {
    lead: 3000,
    pass: 2600,
    big: 2200,
    start: 3000,
    cross: 1900,
    win: 2500,
  };
  const W = 1200,
    LABEL = 150,
    START_X = 245,
    FINISH_X = 1050,
    LANE_H = 74,
    TOP = 30;

  const now = new Date();
  const saved = store.get();
  const ui = {
    mode: savedMode(),
    look: THEMES[saved.look] ? saved.look : "cars",
    period: null,
  };

  function selectTeam(t, periodId) {
    team = t;
    members = t.members;
    refreshedAt = t.refreshedAt;
    LAST = lastPlaceMark(t);
    eff = effectivePeriods(t.periods, now);
    counts = countByPeriod(t.events, members, eff);
    fallback = latestFinishedPeriod(eff, now) || eff.at(-1);
    ui.period = eff.find((p) => p.id === periodId) || fallback;
    store.set({ team: t.id });
  }
  const writeHash = () =>
    history.replaceState(null, "", hashFor(team.id, ui.period?.id));
  const fromHash = () =>
    resolveSelection(DATA.teams, parseHash(location.hash), store.get().team);

  function renderTopBar() {
    mountTopBar(
      document.getElementById("topbar"),
      {
        reports: DATA.reports,
        current: DATA.current,
        teams: DATA.teams,
        teamId: team.id,
        mode: ui.mode,
      },
      {
        onTeam: (id) => {
          selectTeam(
            DATA.teams.find((t) => t.id === id),
            null,
          );
          writeHash();
          reset();
        },
        onMode: (mode) => {
          ui.mode = mode;
          recolor();
        },
      },
    );
  }
  const theme = () => THEMES[ui.look] || THEMES.cars;

  let race,
    status,
    lanes,
    byId,
    stage,
    raf,
    confettiRaf,
    pausedAt = null,
    pausedTotal = 0,
    lastFrame = 0,
    phraseN = 0,
    timers = [];
  const clock = () => (pausedAt ?? performance.now()) - pausedTotal;

  const paintLane = (l) => {
    const v = SERIES[members.indexOf(l.m) % SERIES.length];
    l.color = cssVar(v);
    l.ink = cssVar(`${v}-ink`);
  };
  const resolvedMode = () =>
    ui.mode !== "auto"
      ? ui.mode
      : matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
  const kebab = (k) => k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`);
  function applyScene() {
    const el = document.getElementById("stage");
    if (!el) return;
    const pal = theme().palette[resolvedMode()] || theme().palette.light;
    for (const [k, v] of Object.entries(pal))
      el.style.setProperty(`--scene-${kebab(k)}`, v);
  }

  const geom = () => ({
    width: W,
    height: TOP + lanes.length * LANE_H + 16,
    top: TOP,
    lanes: lanes.length,
    laneHeight: LANE_H,
    labelWidth: LABEL,
    startX: START_X,
    finishX: FINISH_X,
  });
  const size = () => theme().size || { w: 58, h: 30 };
  const xFor = (d) => START_X + (d / race.finishDist) * (FINISH_X - START_X);
  const miniRacer = (l) => {
    const { w, h } = size();
    return `<svg class="mini" data-lane="${esc(l.m.id)}" viewBox="-1 0 ${w + 2} ${h}" width="46" height="${Math.round((46 * h) / (w + 2))}" aria-hidden="true">${theme().racer(l.color, initials(l.m), { wheel: "#7d8590", ink: l.ink })}</svg>`;
  };

  function setup() {
    timers.forEach(clearTimeout);
    timers = [];
    const p = ui.period;
    status = periodStatus(p, now, refreshedAt);
    const start = Date.parse(p.start);
    const end = Math.max(start + 1, Date.parse(status.clockEnd));
    lanes = members
      .filter((m) => counts[p.id]?.[m.id])
      .map((m) => {
        const from = m.from ? Date.parse(m.from) : -Infinity;
        const to = m.to ? Date.parse(m.to) : Infinity;
        return {
          m,
          times: counts[p.id][m.id].prs
            .flatMap((pr) => pr.reviewAts)
            .map((a) => Date.parse(a))
            .sort((a, b) => a - b),
          joinAt: from > start ? from : null,
          leaveAt: to < end ? to : null,
        };
      });
    lanes.forEach((l) => {
      paintLane(l);
      l.bubble = null;
      l.medal = null;
    });
    byId = new Map(lanes.map((l) => [l.m.id, l]));
    race = createRace({
      racers: lanes.map((l) => ({
        id: l.m.id,
        times: l.times,
        joinAt: l.joinAt,
        leaveAt: l.leaveAt,
      })),
      start,
      end,
      scaleEnd: status.state === "live" ? Date.parse(p.plannedEnd) || end : end,
      isWeekend,
    });
    lanes.forEach((l, i) => {
      l.r = race.racers[i];
    });
    stage = { queue: [], banner: null, ceremony: null };
    pausedAt = null;
    pausedTotal = 0;
  }

  function trackSvg() {
    const t = theme();
    const g = geom();
    const ticks = [];
    const step = race.finishDist > 60 ? 20 : race.finishDist > 20 ? 10 : 5;
    for (let d = step; d < race.finishDist - step / 2; d += step) {
      const x = xFor(d);
      ticks.push(
        `<line x1="${x}" x2="${x}" y1="${TOP}" y2="${TOP + lanes.length * LANE_H}" stroke="var(--scene-grid)"/><text class="tick tabular" x="${x}" y="${TOP - 8}" text-anchor="middle">${d}</text>`,
      );
    }
    const names = lanes
      .map((l, i) => {
        const y = TOP + i * LANE_H;
        return `<rect x="12" y="${y + 14}" width="5" height="${LANE_H - 28}" rx="2.5" fill="${l.color}"/>
        <text class="lane-name" x="28" y="${y + LANE_H / 2 + 1}" data-y="${y + LANE_H / 2 + 1}" data-name="${esc(l.m.displayName || l.m.name)}">${esc(l.m.displayName || l.m.name)}</text>
        <text class="lane-sub tabular" id="sub-${esc(l.m.id)}" x="28" y="${y + LANE_H / 2 + 18}"></text>`;
      })
      .join("");
    const racers = lanes
      .map(
        (
          l,
        ) => `<g class="car" id="car-${esc(l.m.id)}"><g class="flame" opacity="0">${t.effects.boost()}</g>${t.racer(l.color, initials(l.m), { ink: l.ink })}</g>
      <text class="tag" id="tag-${esc(l.m.id)}" fill="${l.color}"></text>
      <g class="bubble" id="bub-${esc(l.m.id)}" opacity="0"><rect class="bg" height="24" rx="5" fill="#fbfbf8"/><rect class="edge" width="4" height="24" rx="2" fill="${l.color}"/><text x="12" y="16.5"></text></g>`,
      )
      .join("");
    return `<svg class="track" viewBox="0 0 ${W} ${g.height}" role="img" aria-label="Race track with ${lanes.length} lanes">
      ${t.field(g)}${names}${ticks.join("")}
      <text class="tick" x="${FINISH_X + 8}" y="${TOP - 8}" text-anchor="middle">${race.finishDist}</text>
      ${racers}</svg>`;
  }

  function timelineHtml() {
    const span = race.end - race.start;
    const words = theme().words;
    const cells = calendarDays(race.start, race.end)
      .map(([t, next]) => {
        const w =
          ((Math.min(next, race.end) - Math.max(t, race.start)) / span) * 100;
        const wk = isWeekend(t);
        return `<div class="day${wk ? " wk" : ""}" style="width:${w}%"><span>${esc(wk ? words.weekendDay : new Date(t).toLocaleDateString(undefined, { weekday: "narrow" }))}</span></div>`;
      })
      .join("");
    return `<div class="timeline"><div class="days">${cells}</div><div class="marker" id="marker"></div></div>`;
  }

  function header() {
    const p = ui.period;
    const t = theme();
    const sprintOpts = [...eff]
      .reverse()
      .map(
        (x) =>
          `<option value="${esc(x.id)}" ${x.id === p.id ? "selected" : ""}>${esc(x.name)}${x.inProgress ? " (current)" : ""}</option>`,
      )
      .join("");
    const lookOpts = Object.values(THEMES)
      .map(
        (x) =>
          `<option value="${esc(x.id)}" ${x.id === t.id ? "selected" : ""}>${esc(x.label)}</option>`,
      )
      .join("");
    return `<header class="page-head">
      <div>
        <h1>${esc(fill(t.words.title, { name: p.name }))}</h1>
        <p class="page-sub">${esc(team.name)}, ${esc(fmtDay(race.start))} to ${esc(fmtDay(race.end))}. Every submitted review moves a racer forward.</p>
      </div>
      <div class="controls">
        <div class="row">
          <label class="control">Sprint<select id="ctl-sprint">${sprintOpts}</select></label>
          <label class="control">Look<select id="ctl-look">${lookOpts}</select></label>
        </div>
        <div class="row">
          <button type="button" id="ctl-pause" class="btn icon-btn" disabled>${ICONS.pause}<span>Pause</span></button>
          <button type="button" id="ctl-restart" class="btn icon-btn" disabled>${ICONS.restart}<span>Restart</span></button>
          <button type="button" id="ctl-skip" class="btn icon-btn" disabled>${ICONS.skip}<span>Skip to finish</span></button>
        </div>
      </div>
    </header>`;
  }

  function render() {
    const app = document.getElementById("app");
    renderTopBar();
    if (!eff.length) {
      app.innerHTML = `<p class="page-sub">No sprints are configured for ${esc(team.name)} yet. Add some to config/periods/${esc(team.id)}.json and rebuild.</p>`;
      return;
    }
    app.innerHTML = `${header()}
      <section class="stage" id="stage">
        <div class="callout" id="callout" role="status" aria-live="polite"></div>
        <div id="track">${lanes.length ? trackSvg() : `<div class="empty-race">Nobody on the team overlaps ${esc(ui.period.name)}.</div>`}</div>
        <div class="clock"><div class="when tabular" id="when"></div>${timelineHtml()}<span class="pit-flag" id="pit">${esc(theme().words.weekendFlag)}</span></div>
        <div class="overlay" id="overlay" hidden></div>
        <canvas class="confetti" id="confetti"></canvas>
      </section>
      <details class="log-wrap"><summary>Race log</summary><div class="log" id="log"></div></details>`;
    applyScene();
    wire();
    if (!lanes.length) return;
    bindLanes();
    draw();
    showGrid();
  }

  function wire() {
    document.getElementById("ctl-sprint").addEventListener("change", (e) => {
      ui.period = eff.find((x) => x.id === e.target.value) || fallback;
      writeHash();
      reset();
    });
    document.getElementById("ctl-look").addEventListener("change", (e) => {
      ui.look = THEMES[e.target.value] ? e.target.value : "cars";
      store.set({ look: ui.look });
      reset();
    });
    document.getElementById("ctl-skip").addEventListener("click", skipToFinish);
    document.getElementById("ctl-pause").addEventListener("click", togglePause);
    document.getElementById("ctl-restart").addEventListener("click", reset);
  }

  function recolor() {
    applyScene();
    if (!lanes?.length) return;
    lanes.forEach(paintLane);
    document.getElementById("track").innerHTML = trackSvg();
    bindLanes();
    document.querySelectorAll("svg.mini[data-lane]").forEach((svg) => {
      svg.outerHTML = miniRacer(byId.get(svg.dataset.lane));
    });
    draw();
  }

  // SVG text cannot wrap, so a name wider than the label panel splits onto two lines.
  function fitLaneNames() {
    const max = LABEL - 38;
    document.querySelectorAll("#track .lane-name").forEach((t) => {
      const name = t.dataset.name;
      t.textContent = name;
      const y = Number(t.dataset.y);
      const sub = t.nextElementSibling;
      sub.setAttribute("y", y + 17);
      const cut = name.lastIndexOf(" ");
      if (cut < 0 || t.getComputedTextLength() <= max) return;
      t.textContent = "";
      [name.slice(0, cut), name.slice(cut + 1)].forEach((line, i) => {
        const span = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "tspan",
        );
        span.setAttribute("x", 28);
        span.setAttribute("y", y - 9 + i * 18);
        span.textContent = line;
        t.appendChild(span);
      });
      sub.setAttribute("y", y + 26);
    });
  }

  function bindLanes() {
    fitLaneNames();
    document.fonts?.ready.then(fitLaneNames);
    for (const l of lanes) {
      const bub = document.getElementById(`bub-${l.m.id}`);
      const car = document.getElementById(`car-${l.m.id}`);
      l.el = {
        car,
        flame: car.querySelector(".flame"),
        tag: document.getElementById(`tag-${l.m.id}`),
        sub: document.getElementById(`sub-${l.m.id}`),
        bub,
        bubText: bub.querySelector("text"),
        bubBg: bub.querySelector(".bg"),
        bubEdge: bub.querySelector(".edge"),
        bubW: 0,
      };
    }
  }

  function freshness() {
    if (!refreshedAt)
      return '<p class="note warn">Review data has never been refreshed.</p>';
    const stale =
      now.getTime() - Date.parse(refreshedAt) > 3_600_000 &&
      (status.state !== "final" ||
        Date.parse(refreshedAt) < Date.parse(ui.period.end));
    return `<p class="note${stale ? " warn" : ""}">Data refreshed ${esc(fmtAgo(refreshedAt))}${stale ? ". That was more than an hour ago, so recent reviews may be missing." : "."}</p>`;
  }

  function showGrid() {
    const ov = document.getElementById("overlay");
    const t = theme();
    ov.hidden = false;
    ov.innerHTML = `<h2>${esc(fill(t.words.grid, { n: lanes.length }))}</h2>
      <div class="lineup">${lanes.map((l) => `<span>${miniRacer(l)}${esc(memberLabel(l.m))}</span>`).join("")}</div>
      ${freshness()}
      <div class="gantry"><div class="lights" id="lights">${"<i></i>".repeat(t.start.lights)}</div><div class="count" id="count"></div></div>
      <button type="button" class="go" id="go">${esc(t.start.button)}</button>`;
    document.getElementById("go").addEventListener("click", lightsOut);
  }

  function lightsOut() {
    const go = document.getElementById("go");
    go.disabled = true;
    go.style.visibility = "hidden";
    const lights = [...document.querySelectorAll("#lights i")];
    const count = document.getElementById("count");
    const STEP = 800;
    const n = lights.length;
    lights.forEach((light, i) =>
      timers.push(
        setTimeout(
          () => {
            light.classList.add("red");
            count.textContent = n - i;
          },
          STEP * i + 200,
        ),
      ),
    );
    timers.push(
      setTimeout(
        () => {
          lights.forEach((l) => {
            l.classList.remove("red");
            l.classList.add("green");
          });
          count.textContent = theme().start.go;
          count.classList.add("go-text");
        },
        STEP * n + 200,
      ),
    );
    timers.push(
      setTimeout(
        () => {
          document.getElementById("overlay").hidden = true;
          for (const id of ["ctl-skip", "ctl-pause", "ctl-restart"])
            document.getElementById(id).disabled = false;
          handle(start(race));
          lastFrame = clock();
          raf = requestAnimationFrame(tick);
        },
        STEP * n + 650,
      ),
    );
  }

  function enqueue(c) {
    const item = { ...c, at: clock() };
    logLine(c.t, c.text);
    if (c.now) {
      stage.queue = [item];
      stage.banner = null;
      return;
    }
    stage.queue.push(item);
    if (stage.queue.length > 2) {
      const low = stage.queue.reduce(
        (lo, x, i) => (x.pri < stage.queue[lo].pri ? i : lo),
        0,
      );
      stage.queue.splice(low, 1);
    }
  }

  function showNextCallout(nowMs) {
    if (stage.banner && nowMs < stage.banner.until) return;
    const el = document.getElementById("callout");
    let next = stage.queue.shift();
    while (next && nowMs - next.at > (next.pri >= 3 ? 5000 : 3000))
      next = stage.queue.shift();
    if (!next) {
      if (stage.banner) {
        el.classList.remove("show");
        stage.banner = null;
      }
      return;
    }
    stage.banner = { until: nowMs + (BANNER_MS[next.kind] ?? BANNER_MS.big) };
    el.className = `callout${next.big ? " big" : ""}`;
    const edge = next.duel
      ? `linear-gradient(180deg, ${next.duel.a.color} 50%, ${next.duel.b.color} 50%)`
      : next.l
        ? next.l.color
        : "repeating-conic-gradient(#f2f2f2 0 25%, #111 0 50%) 0 0 / 8px 8px";
    const body = next.duel
      ? `${miniRacer(next.duel.a)}<b>${esc(memberLabel(next.duel.a.m))}</b><span class="verb">${esc(next.duel.verb)}</span>${miniRacer(next.duel.b)}<b>${esc(memberLabel(next.duel.b.m))}</b>${next.duel.pill ? `<span class="pill">${esc(next.duel.pill)}</span>` : ""}`
      : `${next.l ? miniRacer(next.l) : ""}<b>${esc(next.text)}</b>`;
    el.innerHTML = `<i class="edge" style="background:${edge}"></i><span class="cap">${body}</span>`;
    void el.offsetWidth;
    el.classList.add("show");
  }

  function logLine(t, text) {
    const log = document.getElementById("log");
    const row = document.createElement("div");
    row.innerHTML = `<b>${esc(t ? fmtWhen(t) : "Race")}</b> · ${esc(text)}`;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function bubble(l, text, t, logText = text) {
    l.bubble = { text, until: clock() + BUBBLE_MS, shownAt: clock() };
    logLine(t, `${memberLabel(l.m)}: ${logText}`);
  }

  function handle(evs) {
    const ph = theme().phrases;
    for (const e of evs) {
      const a = e.a && byId.get(e.a);
      const b = e.b && byId.get(e.b);
      if (e.type === "start")
        enqueue({
          text: pick(ph.start, phraseN++),
          kind: "start",
          pri: 3,
          big: true,
        });
      else if (e.type === "lead" || e.type === "pass") {
        const lead = e.type === "lead";
        const verb = e.back
          ? pick(ph.back, phraseN++)
          : pick(lead ? ph.lead : ph.pass, phraseN++);
        const pill = lead ? "Leader" : `for ${ordinal(e.place)}`;
        enqueue({
          t: e.t,
          l: a,
          kind: lead ? "lead" : "pass",
          pri: lead ? 3 : 2,
          duel: { a, b, verb, pill },
          text: `${memberLabel(a.m)} ${verb} ${memberLabel(b.m)}${lead ? "" : ` ${pill}`}`,
        });
      } else if (e.type === "tie") {
        const pill = fill(pick(ph.tie, phraseN++), { place: ordinal(e.place) });
        enqueue({
          t: e.t,
          l: a,
          kind: "pass",
          pri: 2,
          duel: { a, b, verb: "and", pill },
          text: `${memberLabel(a.m)} and ${memberLabel(b.m)} ${pill}`,
        });
      } else if (e.type === "join")
        enqueue({
          t: e.t,
          l: a,
          kind: "pass",
          pri: 2,
          text: fill(pick(ph.join, phraseN++), { a: memberLabel(a.m) }),
        });
      else if (e.type === "leave")
        bubble(
          a,
          fill(pick(ph.leave, phraseN++), { a: memberLabel(a.m) }),
          e.t,
        );
      else if (e.type === "boost") {
        const text = pick(ph.boost, phraseN++);
        bubble(a, text, e.t, `${text} (${RACE.boostN}+ reviews in an hour)`);
      } else if (e.type === "weekend")
        bubble(
          a,
          fill(pick(ph.weekend, phraseN++), {
            day: new Date(e.day).toLocaleDateString(undefined, {
              weekday: "long",
            }),
          }),
          e.t,
        );
      else if (e.type === "timeUp") {
        if (status.state === "live")
          enqueue({
            t: e.t,
            text: pick(ph.soFar, phraseN++),
            kind: "start",
            pri: 3,
            big: true,
          });
        else if (e.queued)
          enqueue({
            t: e.t,
            text: pick(ph.timeUp, phraseN++),
            kind: "start",
            pri: 3,
            big: true,
          });
      } else if (e.type === "ceremony") startCeremony();
    }
  }

  function tick() {
    const nowMs = clock();
    const dt = nowMs - lastFrame;
    lastFrame = nowMs;
    if (pausedAt === null) {
      handle(step(race, dt, nowMs));
      if (race.phase === "ceremony") runCeremony(nowMs);
      showNextCallout(nowMs);
      draw();
    }
    if (race.phase !== "done") raf = requestAnimationFrame(tick);
  }

  function crossText(g) {
    const fin = theme().phrases.finish;
    const ls = g.ids.map((id) => byId.get(id));
    const names = ls.map((l) => memberLabel(l.m)).join(" & ");
    const n = ls[0].r.final;
    const last = g.last && LAST;
    const kind =
      n === 0
        ? "garage"
        : g.place === 1
          ? "first"
          : last
            ? "last"
            : g.place === 2
              ? "second"
              : g.place === 3
                ? "third"
                : "middle";
    const tpl = ls.length > 1 ? fin[kind].shared : fin[kind].one;
    return `${fill(tpl, { names, n, place: ordinal(g.place), last: LAST || "" })}${kind === "garage" && last ? ` ${LAST}` : ""}`;
  }

  function startCeremony() {
    document.getElementById("ctl-skip").disabled = true;
    stage.queue = [];
    if (status.state === "live") {
      stage.ceremony = { groups: [], i: 0, next: clock() + 2500 };
      return;
    }
    enqueue({
      text: pick(theme().phrases.checkered, phraseN++),
      kind: "big",
      pri: 3,
      big: true,
      now: true,
    });
    stage.ceremony = {
      groups: ceremonyGroups(race),
      i: 0,
      next: clock() + 2300,
    };
  }

  function runCeremony(nowMs) {
    const c = stage.ceremony;
    if (!c || nowMs < c.next) return;
    if (c.i < c.groups.length) {
      const g = c.groups[c.i++];
      const parkNose = (FINISH_X + 16 + W - 10) / 2 + size().w / 2;
      g.ids.forEach((id) => {
        const l = byId.get(id);
        l.medal =
          g.last && LAST ? LAST : g.zero ? null : MEDALS[g.place] || "🏁";
        if (l.r.final > 0)
          l.r.crossTarget =
            (race.finishDist * (parkNose - START_X)) / (FINISH_X - START_X);
      });
      const kind = g.place === 1 ? "win" : "cross";
      enqueue({
        text: crossText(g),
        kind,
        pri: 3,
        big: g.place === 1,
        l: byId.get(g.ids[0]),
        now: true,
      });
      c.next = nowMs + BANNER_MS[kind] + 200;
      return;
    }
    race.phase = "done";
    document.getElementById("ctl-pause").disabled = true;
    timers.push(setTimeout(showFinal, 600));
  }

  function showFinal() {
    stage.queue = [];
    document.getElementById("callout").classList.remove("show");
    const ov = document.getElementById("overlay");
    const t = theme();
    const places = placesBy(lanes, (l) => l.r.final);
    const scored = lanes.some((l) => l.r.final > 0);
    const ranked = [...lanes].sort((a, b) => places.get(a) - places.get(b));
    const lastPlace = Math.max(...ranked.map((l) => places.get(l)));
    const back = `<a class="btn" href="${esc(boardHref)}${hashFor(team.id, ui.period.id)}">Back to leaderboard</a>`;
    const actions = `<div class="actions"><button type="button" class="btn" id="again">Replay</button>${back}</div>`;
    if (status.state === "live") {
      ov.innerHTML = `<h2>${esc(pick(t.phrases.soFar, 0))}</h2>
        <div class="standings">${ranked.map((l) => `<span>${ordinal(places.get(l))} ${esc(memberLabel(l.m))} · ${l.r.final}</span>`).join("")}</div>
        <p class="note">The sprint is still running, so these are standings, not results.</p>${actions}`;
    } else {
      const stepHtml = (pl) => {
        const ls = ranked.filter((l) => places.get(l) === pl && l.r.final > 0);
        if (!ls.length)
          return `<div class="step p${pl} empty"><div class="cars"></div><div class="name">Open</div><div class="block"><div class="medal">${MEDALS[pl]}</div><div class="num">No one</div></div></div>`;
        return `<div class="step p${pl}"><div class="cars">${ls.map(miniRacer).join("")}</div><div class="name">${ls.map((l) => esc(memberLabel(l.m))).join(" & ")}</div>
          <div class="block"><div class="medal">${MEDALS[pl]}</div><div class="num tabular">${ls[0].r.final} ${ls[0].r.final === 1 ? "review" : "reviews"}</div></div></div>`;
      };
      const others = ranked.filter((l) => places.get(l) > 3 || l.r.final === 0);
      ov.innerHTML = `<h2>${esc(fill(t.words.results, { name: ui.period.name }))}</h2>
        <div class="podium">${stepHtml(2)}${stepHtml(1)}${stepHtml(3)}</div>
        ${others.length ? `<div class="others">${others.map((l) => `<span>${LAST && places.get(l) === lastPlace && lastPlace > 3 ? esc(LAST) : ordinal(places.get(l))} ${esc(memberLabel(l.m))} · ${l.r.final}</span>`).join("")}</div>` : ""}
        ${status.state === "provisional" ? '<p class="note warn">Sprint not yet closed in Jira, results may change.</p>' : ""}${actions}`;
    }
    ov.hidden = false;
    document.getElementById("again").addEventListener("click", () => {
      reset();
      document.getElementById("go")?.click();
    });
    if (status.state !== "live" && scored) confetti();
  }

  function togglePause() {
    const btn = document.getElementById("ctl-pause");
    if (pausedAt !== null) {
      pausedTotal += performance.now() - pausedAt;
      pausedAt = null;
      btn.innerHTML = `${ICONS.pause}<span>Pause</span>`;
    } else {
      pausedAt = performance.now();
      btn.innerHTML = `${ICONS.play}<span>Resume</span>`;
    }
    document
      .getElementById("stage")
      .classList.toggle("paused", pausedAt !== null);
  }

  function skipToFinish() {
    if (pausedAt !== null) togglePause();
    stage.queue = [];
    lanes.forEach((l) => {
      l.bubble = null;
    });
    skip(race);
  }

  function draw() {
    const placeOf = placesBy(race.racers, drivenOf);
    const { w: carW, h: carH } = size();
    const nowMs = clock();
    const started =
      race.phase !== "grid" && race.racers.some((r) => r.shownDist > 0.05);
    lanes.forEach((l, i) => {
      const r = l.r;
      const y = TOP + i * LANE_H + LANE_H / 2 - carH / 2;
      const x = xFor(r.drawDist) - carW;
      const jitter =
        r.boost && race.phase === "race" ? Math.sin(nowMs / 40 + i) * 0.8 : 0;
      const { car, flame, tag, sub, bub, bubText, bubBg, bubEdge } = l.el;
      car.setAttribute(
        "transform",
        `translate(${x.toFixed(1)},${(y + jitter).toFixed(1)})`,
      );
      car.setAttribute(
        "opacity",
        race.phase === "grid" || (r.joined && !r.left) ? 1 : 0.35,
      );
      flame.setAttribute(
        "opacity",
        r.boost ? (0.75 + Math.random() * 0.25).toFixed(2) : 0,
      );
      if (r.boost)
        flame.setAttribute(
          "transform",
          `scale(${(0.85 + Math.random() * 0.35).toFixed(2)},1)`,
        );
      const parked = r.crossTarget !== null && x > FINISH_X;
      tag.setAttribute("x", (parked ? x + carW / 2 : x + carW).toFixed(1));
      tag.setAttribute("y", (y - 5).toFixed(1));
      tag.setAttribute("text-anchor", parked ? "middle" : "end");
      tag.setAttribute("font-size", parked ? 14 : 12);
      let text = "";
      if (race.phase !== "grid" && !r.joined)
        text = `Joins ${fmtDay(l.joinAt)}`;
      else if (race.phase !== "grid" && r.left && !l.medal)
        text = `Left ${fmtDay(l.leaveAt)} · ${ordinal(placeOf.get(r))} · ${drivenOf(r)}`;
      else if (started)
        text = `${l.medal ? `${l.medal} ` : ""}${ordinal(placeOf.get(r))} · ${drivenOf(r)}`;
      if (tag.textContent !== text) tag.textContent = text;
      if (
        l.bubble &&
        nowMs < l.bubble.until &&
        race.phase !== "ceremony" &&
        race.phase !== "done"
      ) {
        if (bubText.textContent !== l.bubble.text) {
          bubText.textContent = l.bubble.text;
          l.el.bubW = bubText.getComputedTextLength() + 22;
          bubBg.setAttribute("width", l.el.bubW);
        }
        const bw = l.el.bubW;
        const nose = x + carW + 10;
        const flip = nose + bw > W - 12;
        bubEdge.setAttribute("x", flip ? bw - 4 : 0);
        bub.setAttribute(
          "transform",
          `translate(${(flip ? x - 12 - bw : nose).toFixed(1)},${(y + carH / 2 - 11).toFixed(1)})`,
        );
        bub.setAttribute(
          "opacity",
          Math.min(
            1,
            (nowMs - l.bubble.shownAt) / 150,
            (l.bubble.until - nowMs) / 300,
          ).toFixed(2),
        );
      } else {
        bub.setAttribute("opacity", 0);
      }
      const subText =
        race.phase === "ceremony" || race.phase === "done"
          ? `${r.final} ${r.final === 1 ? "review" : "reviews"}`
          : "";
      if (sub.textContent !== subText) sub.textContent = subText;
    });
    const when = document.getElementById("when");
    const whenText = fmtWhen(race.simT);
    if (when.textContent !== whenText) when.textContent = whenText;
    document.getElementById("marker").style.left =
      `calc(${((race.simT - race.start) / (race.end - race.start)) * 100}% - 1px)`;
    document
      .getElementById("pit")
      .classList.toggle("on", race.phase === "race" && isWeekend(race.simT));
  }

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("confetti");
    const rect = cv.getBoundingClientRect();
    cv.width = rect.width * devicePixelRatio;
    cv.height = rect.height * devicePixelRatio;
    const ctx = cv.getContext("2d");
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const colors = [
      cssVar("--gold"),
      cssVar("--series-1"),
      cssVar("--series-2"),
      cssVar("--series-3"),
      "#f2f1ee",
    ];
    const bits = Array.from({ length: 160 }, () => ({
      x: rect.width / 2 + (Math.random() - 0.5) * 200,
      y: rect.height * 0.35,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 9 - 3,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      c: colors[Math.floor(Math.random() * colors.length)],
      w: 6 + Math.random() * 6,
      h: 3 + Math.random() * 4,
    }));
    const t0 = performance.now();
    const frame = (t) => {
      ctx.clearRect(0, 0, rect.width, rect.height);
      bits.forEach((b) => {
        b.vy += 0.22;
        b.vx *= 0.99;
        b.x += b.vx;
        b.y += b.vy;
        b.r += b.vr;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.r);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      });
      if (t - t0 < 4500) confettiRaf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, rect.width, rect.height);
    };
    confettiRaf = requestAnimationFrame(frame);
  }

  function reset() {
    cancelAnimationFrame(raf);
    cancelAnimationFrame(confettiRaf);
    timers.forEach(clearTimeout);
    timers = [];
    const focusId = document.activeElement?.id;
    if (eff.length) setup();
    else lanes = [];
    render();
    if (focusId)
      document.getElementById(focusId)?.focus({ preventScroll: true });
  }

  window.addEventListener("hashchange", () => {
    const { team: t, periodId } = fromHash();
    if (!t || (t.id === team?.id && (!periodId || periodId === ui.period?.id)))
      return;
    if (t.id === team.id) ui.period = eff.find((p) => p.id === periodId);
    else selectTeam(t, periodId);
    reset();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (ui.mode === "auto") recolor();
  });

  applyColorMode(ui.mode);
  const initial = fromHash();
  if (!initial.team) {
    document.getElementById("app").innerHTML =
      '<p class="page-sub">No teams are configured yet. Add one to config/teams.json and rebuild.</p>';
    return;
  }
  selectTeam(initial.team, initial.periodId);
  reset();
})();

</script>
</body>
