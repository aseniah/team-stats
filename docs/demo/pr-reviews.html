<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Review Leaderboard</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap");
:root {
  color-scheme: light;
  --surface-0: #f3f2ee;
  --surface-1: #fcfcfb;
  --surface-2: #efeee9;
  --border: #dedcd5;
  --grid: #e6e4de;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7b7a75;
  --accent: #2a78d6;
  --focus: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --series-9: #0092b3;
  --series-10: #a36a2e;
  --series-1-ink: #fff;
  --series-2-ink: #16181b;
  --series-3-ink: #16181b;
  --series-4-ink: #16181b;
  --series-5-ink: #16181b;
  --series-6-ink: #fff;
  --series-7-ink: #fff;
  --series-8-ink: #16181b;
  --series-9-ink: #16181b;
  --series-10-ink: #fff;
  --gold: #e9b10c;
  --silver: #a9b0b8;
  --bronze: #c27a43;
  --highlight: #fff3cf;
  --shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 6px 20px rgb(0 0 0 / 6%);
  --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #34342f;
    --grid: #2c2c28;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --focus: #7fb6f2;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #0ca30c;
    --series-7: #9085e9;
    --series-8: #e66767;
    --series-9: #1fa3c4;
    --series-10: #b5803f;
    --series-1-ink: #16181b;
    --series-2-ink: #16181b;
    --series-3-ink: #16181b;
    --series-4-ink: #16181b;
    --series-5-ink: #16181b;
    --series-6-ink: #16181b;
    --series-7-ink: #16181b;
    --series-8-ink: #16181b;
    --series-9-ink: #16181b;
    --series-10-ink: #16181b;
    --gold: #d9a40a;
    --silver: #8d949c;
    --bronze: #b06a35;
    --highlight: #3a3216;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #242422;
  --border: #34342f;
  --grid: #2c2c28;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --accent: #3987e5;
  --focus: #7fb6f2;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #0ca30c;
  --series-7: #9085e9;
  --series-8: #e66767;
  --series-9: #1fa3c4;
  --series-10: #b5803f;
  --series-1-ink: #16181b;
  --series-2-ink: #16181b;
  --series-3-ink: #16181b;
  --series-4-ink: #16181b;
  --series-5-ink: #16181b;
  --series-6-ink: #16181b;
  --series-7-ink: #16181b;
  --series-8-ink: #16181b;
  --series-9-ink: #16181b;
  --series-10-ink: #16181b;
  --gold: #d9a40a;
  --silver: #8d949c;
  --bronze: #b06a35;
  --highlight: #3a3216;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
}
body {
  background: var(--surface-0);
  color: var(--text-primary);
  font:
    15px / 1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Inter,
    Roboto,
    sans-serif;
  -webkit-font-smoothing: antialiased;
}
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.tabular {
  font-variant-numeric: tabular-nums;
}
.control {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 600;
}
select,
.btn {
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
}
select {
  min-width: 120px;
}
a.btn {
  display: inline-block;
  text-decoration: none;
}
.btn {
  cursor: pointer;
  font-weight: 600;
}
.btn:hover:not(:disabled) {
  border-color: var(--text-muted);
}
button.btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.icon-btn svg {
  flex: none;
}
button:focus-visible,
select:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
}
.theme-toggle:hover {
  color: var(--text-primary);
}
.icon {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  vertical-align: -2px;
}
.icon .fill {
  fill: currentColor;
  stroke: none;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
  }
}

:root {
  --page-width: 1240px;
  --gutter: 16px;
}
main {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 24px var(--gutter) 64px;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--surface-1) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 8px var(--gutter);
  min-height: 56px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 20px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.01em;
  color: var(--text-primary);
}
.brand:hover {
  text-decoration: none;
}
.brand-mark {
  width: 18px;
  height: 18px;
  fill: var(--accent);
}
.nav {
  display: flex;
  gap: 2px;
}
.nav a {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}
.nav a:hover {
  color: var(--text-primary);
  background: var(--surface-2);
  text-decoration: none;
}
.nav a[aria-current="page"] {
  color: var(--text-primary);
  background: var(--surface-2);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.topbar-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.team-picker select {
  min-width: 160px;
  font-weight: 600;
}
.team-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 24px;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-head h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: 36px;
  line-height: 1.05;
  margin: 0 0 6px;
}
.page-sub {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0;
}
.page-sub .icon {
  margin-right: 2px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  align-items: end;
}

@media (max-width: 640px) {
  .topbar-inner {
    gap: 4px 12px;
    padding-top: 6px;
    padding-bottom: 8px;
  }
  .nav {
    order: 3;
    width: 100%;
    margin: 0 -12px;
  }
  .topbar-tools {
    margin-left: auto;
  }
  .team-picker select {
    min-width: 0;
    max-width: 46vw;
  }
  .theme-toggle span {
    display: none;
  }
  .page-head h1 {
    font-size: 28px;
  }
}



.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
.card + .card, .grid + .card, .card + .grid { margin-top: 20px; }
.card h2 { font-size: 16px; margin: 0 0 2px; }
.card .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.watch { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.note-provisional { font-size: 13px; color: var(--text-secondary); margin: 6px 0 0; }
.grid > .card { margin-top: 0; }
.group-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--border); }
.group-title { margin: 0; font-size: 20px; }
.group-head + .grid { margin-top: 16px; }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); margin-top: 20px; }

.hero { padding: 24px 20px 20px; overflow: hidden; position: relative; }
.hero-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.hero-title { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 0; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); vertical-align: middle; margin-left: 8px; }
.badge.live { background: color-mix(in srgb, var(--series-3) 18%, transparent); color: var(--text-primary); }
.badge.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--series-3); margin-right: 6px; vertical-align: 1px; }
.hero-stats { font-size: 13px; color: var(--text-secondary); }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 12px; max-width: 720px; margin: 28px auto 0; }
.step { display: flex; flex-direction: column; align-items: center; text-align: center; }
.step .people { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 40px; justify-content: end; }
.person { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--ink, #fff); font-weight: 700; font-size: 19px; box-shadow: 0 0 0 3px var(--surface-1), 0 0 0 5px var(--ring, transparent); }
.place-1 .avatar { width: 72px; height: 72px; font-size: 24px; }
.person .name { font-family: var(--display); font-weight: 700; font-size: 18px; }
.block { width: 100%; border-radius: 12px 12px 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: start; padding-top: 12px; gap: 2px; position: relative; }
.block .medal { font-size: 34px; line-height: 1; }
.block .num { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--text-primary); }
.block .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-secondary); font-weight: 600; }
.place-1 .block { height: 190px; background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 38%, var(--surface-1)), color-mix(in srgb, var(--gold) 14%, var(--surface-1))); }
.place-2 .block { height: 140px; background: linear-gradient(180deg, color-mix(in srgb, var(--silver) 40%, var(--surface-1)), color-mix(in srgb, var(--silver) 14%, var(--surface-1))); }
.place-3 .block { height: 105px; background: linear-gradient(180deg, color-mix(in srgb, var(--bronze) 38%, var(--surface-1)), color-mix(in srgb, var(--bronze) 14%, var(--surface-1))); }
.place-1 .block .num { font-size: 46px; }
.place-1 .avatar { --ring: var(--gold); }
.place-2 .avatar { --ring: var(--silver); }
.place-3 .avatar { --ring: var(--bronze); }
.crown { font-size: 26px; line-height: 1; margin-bottom: -6px; }
.empty-step .block { opacity: .35; }
.last-place { display: flex; align-items: center; gap: 14px; max-width: 720px; margin: 18px auto 0; padding: 12px 16px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--border); }
.last-place .poo { font-size: 34px; line-height: 1; }
.last-place .txt { font-size: 14px; color: var(--text-secondary); }
.last-place .txt strong { color: var(--text-primary); }
.no-data { text-align: center; color: var(--text-secondary); padding: 32px 0 8px; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 12px; font-weight: 600; color: var(--text-secondary); vertical-align: bottom; white-space: normal; min-width: 72px; }
thead th .pn { display: block; color: var(--text-primary); font-size: 13px; }
tbody tr:last-child td { border-bottom: 0; }
td.lead { background: var(--highlight); font-weight: 700; }
td.total { font-weight: 700; border-left: 1px solid var(--grid); }
th.total { border-left: 1px solid var(--grid); }
td.na { color: var(--text-muted); }
.who { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
tr.team td { color: var(--text-secondary); font-weight: 600; border-top: 1px solid var(--border); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-secondary); margin: -4px 0 10px; }
.chart .weekend { fill: var(--surface-2); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font: inherit; color: inherit; background: none; border: 0; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; cursor: pointer; }
.legend-item:hover { background: var(--surface-2); color: var(--text-primary); }
.legend-item.off { opacity: .45; text-decoration: line-through; }
.legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
.legend .line { width: 16px; height: 2px; border-radius: 1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--text-secondary); font-size: 12px; }
svg.chart .axis-label { fill: var(--text-muted); font-size: 11px; }
svg.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
svg.chart .baseline { stroke: var(--border); stroke-width: 1; }
svg.chart .direct { font-size: 12px; font-weight: 600; fill: var(--text-primary); }
svg.chart .today { stroke: var(--text-muted); stroke-dasharray: 3 3; }
svg.chart .hit { fill: transparent; }
svg.chart .hover-line { stroke: var(--text-muted); stroke-width: 1; }
.tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; min-width: 140px; opacity: 0; transition: opacity .08s; }
.tooltip .tt-title { font-weight: 650; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tooltip .tt-row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }

details.member { border-top: 1px solid var(--grid); }
details.member:first-of-type { border-top: 0; }
details.member summary { cursor: pointer; padding: 10px 0; display: flex; align-items: center; gap: 10px; list-style: none; }
details.member summary::-webkit-details-marker { display: none; }
details.member summary::before { content: "▸"; color: var(--text-muted); width: 12px; transition: transform .1s; }
details.member[open] summary::before { transform: rotate(90deg); }
details.member summary .cnt { margin-left: auto; color: var(--text-secondary); font-size: 13px; }
.pr-list { list-style: none; margin: 0 0 12px; padding: 0 0 0 22px; font-size: 13px; }
.pr-list li { display: grid; grid-template-columns: 170px 1fr auto; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--grid); }
.pr-list li:last-child { border-bottom: 0; }
.pr-list .repo { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-list .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-list .when { color: var(--text-muted); }
.pr-list li.excluded { opacity: .55; }
.pr-list .reason { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--text-secondary); margin-left: 6px; }
.subhead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 8px 0 4px 22px; font-weight: 600; }
footer { margin-top: 28px; font-size: 12px; color: var(--text-muted); }
footer p { margin: 4px 0; }
footer .how { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; color: var(--text-secondary); font-size: 13px; }
footer .how > .icon { width: 18px; height: 18px; flex: none; margin-top: 3px; color: var(--series-1); }
footer .how b { color: var(--text-primary); }
footer .built { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
.how-link { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.how-link:hover { color: var(--text-primary); text-decoration: underline; }
td .rd { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); }
.person .prs { font-size: 11px; color: var(--text-muted); }

@media (max-width: 640px) {
  .podium { gap: 6px; }
  .avatar { width: 44px; height: 44px; font-size: 16px; }
  .place-1 .avatar { width: 56px; height: 56px; font-size: 20px; }
  .place-1 .block { height: 150px; } .place-2 .block { height: 112px; } .place-3 .block { height: 84px; }
  .pr-list li { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>

<script>
// The build inlines this file into both pages by stripping `export `, so it must stay import-free.

const SERIES = Array.from({ length: 10 }, (_, i) => `--series-${i + 1}`);
const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };
const COLOR_MODES = ["auto", "light", "dark"];
const MODE_ICONS = {
  auto: '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" class="fill"/></svg>',
  light:
    '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>',
  dark: '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>',
};

const STORE_KEY = "teamstats.v2";
const store = {
  get() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    } catch {
      return {};
    }
  },
  set(v) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...store.get(), ...v }));
    } catch {
      /* storage unavailable */
    }
  },
};

function applyColorMode(mode) {
  if (mode === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
}

function modeButtonHtml(mode) {
  return `${MODE_ICONS[mode]}<span>${mode[0].toUpperCase()}${mode.slice(1)}</span>`;
}

const esc = (s) =>
  String(s ?? "").replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const memberLabel = (m) => m.displayName || m.name.split(" ")[0];
const initials = (m) =>
  (m.displayName
    ? m.displayName.slice(0, 2)
    : m.name
        .split(" ")
        .map((w) => w[0])
        .join("")
        .slice(0, 2)
  ).toUpperCase();

const decode = (s) => {
  try {
    return decodeURIComponent(s);
  } catch {
    return s;
  }
};

// `#team/period`. A single segment may be a team id or, from links made before teams existed, a period id.
function parseHash(raw) {
  const s = String(raw ?? "").replace(/^#/, "");
  if (!s) return { teamId: null, periodId: null };
  const i = s.indexOf("/");
  if (i < 0) return { teamId: decode(s), periodId: decode(s) };
  return {
    teamId: decode(s.slice(0, i)) || null,
    periodId: decode(s.slice(i + 1)) || null,
  };
}

function resolveSelection(teams, { teamId, periodId }, savedTeamId) {
  const byId = (id) => teams.find((t) => t.id === id);
  const hashTeam = byId(teamId);
  const team = hashTeam || byId(savedTeamId) || teams[0] || null;
  const single = teamId !== null && teamId === periodId;
  const pid = single && hashTeam ? null : periodId;
  return {
    team,
    periodId: team?.periods.some((p) => p.id === pid) ? pid : null,
  };
}

function hashFor(teamId, periodId) {
  return `#${encodeURIComponent(teamId)}${periodId ? `/${encodeURIComponent(periodId)}` : ""}`;
}

// Nav links carry only the team, so each report opens on its own default sprint.
function topBarHtml({ reports, current, teams, teamId, mode }) {
  const nav = reports
    .map(
      (r) =>
        `<a href="${esc(r.href)}${hashFor(teamId)}"${r.id === current ? ' aria-current="page"' : ""}>${esc(r.title)}</a>`,
    )
    .join("");
  const team = teams.find((t) => t.id === teamId);
  const picker =
    teams.length > 1
      ? `<label class="team-picker"><span class="visually-hidden">Team</span><select id="ctl-team">${teams.map((t) => `<option value="${esc(t.id)}"${t.id === teamId ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>`
      : `<span class="team-name">${esc(team?.name ?? "")}</span>`;
  return `<div class="topbar-inner">
    <a class="brand" href="${esc(reports[0]?.href ?? "#")}${hashFor(teamId)}"><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="8" width="3.4" height="6.5" rx="1"/><rect x="6.3" y="3" width="3.4" height="11.5" rx="1"/><rect x="11.1" y="5.5" width="3.4" height="9" rx="1"/></svg>TeamStats</a>
    <nav class="nav" aria-label="Reports">${nav}</nav>
    <div class="topbar-tools">${picker}<button type="button" id="ctl-mode" class="theme-toggle" title="Color mode: ${mode}. Click to change." aria-label="Color mode: ${mode}">${modeButtonHtml(mode)}</button></div>
  </div>`;
}

// Renders the bar into `el` and wires it. `onMode` runs after the mode is applied and saved.
function mountTopBar(el, opts, { onTeam, onMode }) {
  el.innerHTML = topBarHtml(opts);
  el.querySelector("#ctl-team")?.addEventListener("change", (e) =>
    onTeam(e.target.value),
  );
  el.querySelector("#ctl-mode").addEventListener("click", () => {
    const mode =
      COLOR_MODES[(COLOR_MODES.indexOf(opts.mode) + 1) % COLOR_MODES.length];
    store.set({ theme: mode });
    applyColorMode(mode);
    mountTopBar(el, { ...opts, mode }, { onTeam, onMode });
    el.querySelector("#ctl-mode").focus();
    onMode?.(mode);
  });
}

const savedMode = () =>
  COLOR_MODES.includes(store.get().theme) ? store.get().theme : "auto";

const AXIS_STEPS = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000];

// Smallest step that covers `v` in at most 5 gridlines, so the axis grows by 25 rather than doubling.
function niceScale(v) {
  const step =
    AXIS_STEPS.find((s) => Math.ceil(v / s) <= 5) ?? AXIS_STEPS.at(-1);
  const ticks = Math.max(1, Math.ceil(v / step));
  return step === 1 && ticks < 5
    ? { max: 5, ticks: 5 }
    : { max: ticks * step, ticks };
}

<script>
// The build inlines this file into the page by stripping `export `, so it must stay import-free.

const ms = (iso) => Date.parse(iso);

function effectivePeriods(periods, now) {
  const sorted = [...periods].sort((a, b) => ms(a.start) - ms(b.start));
  return sorted.map((p, i) => {
    const next = sorted[i + 1];
    return {
      ...p,
      end: next ? next.start : now.toISOString(),
      inProgress: !next,
    };
  });
}

function assignPeriod(at, eff) {
  const t = ms(at);
  const p = eff.find((x) => ms(x.start) <= t && t < ms(x.end));
  return p ? p.id : null;
}

function classifyEvent(ev, pr) {
  const t = ms(ev.at);
  if (pr.mergedAt && t > ms(pr.mergedAt)) return "after-merge";
  if (ev.state === "COMMENTED" && !ev.hasBody && ev.inlineComments <= 1)
    return "inline-comment";
  return null;
}

function memberWindow(m) {
  return {
    from: m.from ? ms(m.from) : -Infinity,
    to: m.to ? ms(m.to) : Infinity,
  };
}

function inWindow(t, w) {
  return w.from <= t && t < w.to;
}

function countByPeriod(events, members, eff) {
  const byLogin = new Map();
  for (const m of members)
    byLogin.set(m.github, [
      ...(byLogin.get(m.github) ?? []),
      { m, w: memberWindow(m) },
    ]);
  const result = {};
  for (const p of eff) {
    result[p.id] = {};
    for (const m of members) {
      const w = memberWindow(m);
      const overlaps = w.from < ms(p.end) && ms(p.start) < w.to;
      result[p.id][m.id] = overlaps ? { count: 0, reviews: 0, prs: [] } : null;
    }
  }
  const seen = new Map();
  const sorted = [...events].sort((a, b) => ms(a.at) - ms(b.at));
  for (const e of sorted) {
    if (e.excluded) continue;
    const m = byLogin.get(e.login)?.find((x) => inWindow(ms(e.at), x.w))?.m;
    if (!m) continue;
    const pid = assignPeriod(e.at, eff);
    const cell = pid && result[pid][m.id];
    if (!cell) continue;
    const key = `${e.repo}#${e.pr}`;
    const seenKey = `${pid}|${m.id}|${key}`;
    let entry = seen.get(seenKey);
    if (!entry) {
      entry = {
        key,
        url: e.url,
        title: e.prTitle,
        repo: e.repo,
        pr: e.pr,
        firstAt: e.at,
        reviewAts: [],
      };
      seen.set(seenKey, entry);
      cell.prs.push(entry);
      cell.count++;
    }
    entry.reviewAts.push(e.at);
    cell.reviews++;
  }
  return result;
}

function rankMembers(cells) {
  const sorted = [...cells].sort(
    (a, b) =>
      b.score - a.score || String(a.memberId).localeCompare(String(b.memberId)),
  );
  const ranked = sorted.map((c) => ({
    ...c,
    place: 1 + sorted.filter((o) => o.score > c.score).length,
  }));
  const maxPlace = Math.max(0, ...ranked.map((r) => r.place));
  return ranked.map((r) => ({
    ...r,
    last: maxPlace > 3 && r.place === maxPlace,
  }));
}

function utcDay(t) {
  return new Date(t).toISOString().slice(0, 10);
}

function dailyCumulative(events, members, period) {
  const counts = countByPeriod(events, members, [period]);
  const start = ms(period.start);
  const end = ms(period.end);
  const days = [];
  for (let d = Date.parse(utcDay(start)); d < end; d += 86_400_000)
    days.push(utcDay(d));
  const out = {};
  for (const m of members) {
    const cell = counts[period.id][m.id];
    if (!cell) continue;
    const perDay = new Map();
    for (const at of cell.prs.flatMap((pr) => pr.reviewAts))
      perDay.set(utcDay(ms(at)), (perDay.get(utcDay(ms(at))) || 0) + 1);
    let total = 0;
    out[m.id] = days.map((day) => ({
      day,
      total: (total += perDay.get(day) || 0),
    }));
  }
  return out;
}

function periodStatus(period, now, refreshedAt) {
  if (!period.inProgress) return { state: "final", clockEnd: period.end };
  const state =
    period.plannedEnd && now.getTime() >= ms(period.plannedEnd)
      ? "provisional"
      : "live";
  const clockEnd = refreshedAt
    ? new Date(Math.min(ms(period.end), ms(refreshedAt))).toISOString()
    : period.end;
  return { state, clockEnd };
}

function latestFinishedPeriod(eff, now) {
  return [...eff]
    .reverse()
    .find((p) => periodStatus(p, now, null).state !== "live");
}

function lastPlaceMark(team) {
  const mark = String(team.lastPlaceEmoji ?? "").trim();
  return mark || null;
}

<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const MAX_RANGE = 10;
  const now = new Date();
  const raceHref =
    DATA.reports.find((r) => r.id === "sprint-race")?.href ??
    "sprint-race.html";
  let team, members, events, eff, counts, LAST;
  const seriesOf = (m) => SERIES[members.indexOf(m) % SERIES.length];
  const colorOf = (m) => `var(${seriesOf(m)})`;
  const state = { n: 4, mode: savedMode(), focus: null, hidden: new Set() };

  function selectTeam(t, periodId) {
    team = t;
    members = t.members;
    events = t.events;
    LAST = lastPlaceMark(t);
    eff = effectivePeriods(t.periods, now);
    counts = countByPeriod(events, members, eff);
    state.n = Math.max(1, Math.min(store.get().n || 4, eff.length, MAX_RANGE));
    state.focus =
      (eff.find((p) => p.id === periodId) || eff.at(-1))?.id ?? null;
    state.hidden.clear();
    openDrill.clear();
    teamChanged = true;
    store.set({ team: t.id });
  }
  const writeHash = () =>
    history.replaceState(null, "", hashFor(team.id, state.focus));
  const shown = () => members.filter((m) => !state.hidden.has(m.id));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const ICON_INFO =
    '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4"/><circle cx="8" cy="4.9" r=".6" class="fill"/></svg>';
  const ICON_PLAY =
    '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6l7.5-4.8z" class="fill"/></svg>';
  const ICON_CAL =
    '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';

  const fmtDate = (iso, opts = { month: "short", day: "numeric" }) =>
    new Date(iso).toLocaleDateString(undefined, opts);
  const fmtDateTime = (iso) =>
    new Date(iso).toLocaleString(undefined, {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
    });
  const periodLabel = (p) => p.label ?? p.name;
  const displayEnd = (p) => (p.inProgress ? p.plannedEnd || p.end : p.end);

  function rangePeriods() {
    return eff.slice(-state.n);
  }

  function cellsFor(pid) {
    return members
      .filter((m) => counts[pid][m.id])
      .map((m) => ({
        memberId: m.id,
        score: counts[pid][m.id].reviews,
        prCount: counts[pid][m.id].count,
      }));
  }
  const teamPrs = (pid) =>
    new Set(
      members.flatMap((m) => counts[pid][m.id]?.prs.map((pr) => pr.key) ?? []),
    ).size;
  const tip = document.getElementById("tooltip");
  function showTip(evt, html) {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let x = evt.clientX + pad;
    let y = evt.clientY + pad;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${Math.max(8, y)}px`;
  }
  const hideTip = () => {
    tip.style.opacity = 0;
  };
  const ttRows = (rows) =>
    rows
      .map(
        (r) =>
          `<div class="tt-row"><span><i class="dot" style="background:${r.color}"></i>${esc(r.name)}</span><b class="tabular">${r.value}</b></div>`,
      )
      .join("");
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs = {}, parent) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs))
      if (v !== undefined && v !== null) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }
  function yAxis(svg, { x0, x1, y0, y1, max, ticks = 4 }) {
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i;
      const y = y0 - ((y0 - y1) * i) / ticks;
      el(
        "line",
        {
          x1: x0,
          x2: x1,
          y1: y,
          y2: y,
          class: i === 0 ? "baseline" : "grid-line",
        },
        svg,
      );
      const t = el(
        "text",
        { x: x0 - 8, y: y + 4, "text-anchor": "end", class: "tabular" },
        svg,
      );
      t.textContent = Number.isInteger(v) ? v : v.toFixed(1);
    }
  }
  function legend(kind) {
    return `<div class="legend">${members
      .map((m) => {
        const off = state.hidden.has(m.id);
        return `<button type="button" class="legend-item${off ? " off" : ""}" data-member="${esc(m.id)}" aria-pressed="${!off}" title="${off ? "Show" : "Hide"} ${esc(memberLabel(m))}"><i class="${kind}" style="background:${colorOf(m)}"></i>${esc(memberLabel(m))}</button>`;
      })
      .join("")}</div>`;
  }
  function barPath(x, y, w, h, r = 4) {
    if (h <= 0) return "";
    const rr = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + w - rr}Q${x + w},${y} ${x + w},${y + rr}V${y + h}Z`;
  }
  function renderRangeHead() {
    const maxN = Math.min(eff.length, MAX_RANGE);
    const nOpts = Array.from({ length: maxN }, (_, i) => i + 1)
      .map(
        (n) =>
          `<option value="${n}" ${n === state.n ? "selected" : ""}>Last ${n} ${n === 1 ? "sprint" : "sprints"}</option>`,
      )
      .join("");
    return `<div class="group-head"><h2 class="group-title">Across sprints</h2>
      <label class="control">Range<select id="ctl-n">${nOpts}</select></label></div>`;
  }

  function renderHeader() {
    const refreshed = team.refreshedAt
      ? fmtDateTime(team.refreshedAt)
      : "never";
    const fOpts = [...eff]
      .reverse()
      .map(
        (p) =>
          `<option value="${esc(p.id)}" ${p.id === state.focus ? "selected" : ""}>${esc(p.name)}${p.inProgress ? " (current)" : ""}</option>`,
      )
      .join("");
    return `<header class="page-head">
      <div>
        <h1>PR Review Leaderboard</h1>
        <p class="page-sub">${esc(team.name)} · ${ICON_CAL} Data refreshed ${esc(refreshed)} · <a href="#how" class="how-link">${ICON_INFO}How it's counted</a></p>
      </div>
      ${eff.length ? `<div class="controls"><label class="control">Sprint<select id="ctl-focus">${fOpts}</select></label></div>` : ""}
    </header>`;
  }

  function renderTopBar() {
    mountTopBar(
      document.getElementById("topbar"),
      {
        reports: DATA.reports,
        current: DATA.current,
        teams: DATA.teams,
        teamId: team.id,
        mode: state.mode,
      },
      {
        onTeam: (id) => {
          selectTeam(
            DATA.teams.find((t) => t.id === id),
            null,
          );
          writeHash();
          render();
        },
        onMode: (mode) => {
          state.mode = mode;
        },
      },
    );
  }

  function personHtml(m, prCount) {
    return `<div class="person"><div class="avatar" style="background:${colorOf(m)};--ink:var(${seriesOf(m)}-ink)">${esc(initials(m))}</div>
      <div class="name">${esc(m.displayName || m.name)}</div><div class="prs tabular">${plural(prCount, "PR", "PRs")}</div></div>`;
  }

  function renderPodium() {
    const p = eff.find((x) => x.id === state.focus);
    if (!p)
      return `<section class="card hero"><div class="no-data">No sprints configured yet.</div></section>`;
    const ranked = rankMembers(cellsFor(p.id));
    const byId = Object.fromEntries(members.map((m) => [m.id, m]));
    const total = ranked.reduce((s, r) => s + r.score, 0);
    const idx = eff.indexOf(p);
    const prev = idx > 0 ? eff[idx - 1] : null;
    const prevTotal = prev
      ? cellsFor(prev.id).reduce((s, c) => s + c.score, 0)
      : null;
    const delta =
      prevTotal === null
        ? ""
        : ` · ${total - prevTotal >= 0 ? "▲" : "▼"} ${Math.abs(total - prevTotal)} vs ${esc(prev.name)}`;
    const st = periodStatus(p, now, team.refreshedAt).state;
    const title = st === "live" ? "Current leader" : "Winner";
    const badge =
      st === "live"
        ? '<span class="badge live">In progress</span>'
        : '<span class="badge">Final</span>';
    const provisional =
      st === "provisional"
        ? '<p class="note-provisional">Sprint not yet closed in Jira, results may change.</p>'
        : "";
    const dates = `${fmtDate(p.start)} – ${fmtDate(displayEnd(p))}`;

    let body;
    if (!ranked.length || total === 0) {
      body = `<div class="no-data">No reviews recorded for this sprint yet.</div>`;
    } else {
      const group = (pl) => {
        const g = ranked.filter((r) => r.place === pl && r.score > 0);
        return g.length ? g : null;
      };
      const step = (g, emptyPlace) => {
        if (!g)
          return `<div class="step place-${emptyPlace} empty-step"><div class="people"></div><div class="block"></div></div>`;
        const place = g[0].place;
        const people = g
          .map((r) => personHtml(byId[r.memberId], r.prCount))
          .join("");
        const crown =
          place === 1 ? '<div class="crown" aria-hidden="true">👑</div>' : "";
        return `<div class="step place-${place}">
          <div class="people">${crown}${people}</div>
          <div class="block"><div class="medal" aria-hidden="true">${MEDALS[place]}</div>
          <div class="num tabular">${g[0].score}</div><div class="lbl">${g[0].score === 1 ? "review" : "reviews"}</div></div>
        </div>`;
      };
      const podium = `<div class="podium">${step(group(2), 2)}${step(group(1), 1)}${step(group(3), 3)}</div>`;
      const last = LAST ? ranked.filter((r) => r.last) : [];
      const lastHtml = last.length
        ? `<div class="last-place"><div class="poo" aria-hidden="true">${esc(LAST)}</div><div class="txt">
            <strong>${last.map((r) => esc(byId[r.memberId].displayName || byId[r.memberId].name)).join(" & ")}</strong>
            brought up the rear with <strong class="tabular">${last[0].score}</strong> ${last[0].score === 1 ? "review" : "reviews"}${st === "live" ? " so far. Still time to climb!" : "."}</div></div>`
        : "";
      body = podium + lastHtml;
    }
    return `<section class="card hero">
      <div class="hero-head">
        <h2 class="hero-title">${title} · ${esc(p.name)} ${badge}</h2>
        <div class="hero-stats tabular">${dates} · ${plural(total, "team review", "team reviews")} on ${plural(teamPrs(p.id), "PR", "PRs")}${delta}</div>
      </div>${provisional}
      ${body}
    </section>`;
  }

  function renderTable() {
    const rp = rangePeriods();
    const placeOf = Object.fromEntries(
      rp.map((p) => [
        p.id,
        Object.fromEntries(
          rankMembers(cellsFor(p.id)).map((r) => [r.memberId, r]),
        ),
      ]),
    );
    const cellHtml = (reviews, prCount, extraClass = "", mark = "") =>
      `<td class="tabular${extraClass}">${mark}${reviews}<span class="rd">${plural(prCount, "PR", "PRs")}</span></td>`;
    const head = rp
      .map(
        (p) =>
          `<th class="tabular"><span class="pn">${esc(periodLabel(p))}${p.inProgress ? "*" : ""}</span>${esc(fmtDate(p.start))}</th>`,
      )
      .join("");
    const rows = members
      .map((m) => {
        const cells = rp
          .map((p) => {
            const c = counts[p.id][m.id];
            if (!c) return '<td class="na">–</td>';
            const r = placeOf[p.id][m.id];
            const scored = r && c.reviews > 0;
            const mark =
              r?.last && LAST
                ? `${esc(LAST)} `
                : scored && MEDALS[r.place]
                  ? `${MEDALS[r.place]} `
                  : "";
            return cellHtml(
              c.reviews,
              c.count,
              scored && r.place === 1 ? " lead" : "",
              mark,
            );
          })
          .join("");
        const tot = rp.reduce(
          (s, p) => s + (counts[p.id][m.id]?.count || 0),
          0,
        );
        const totReviews = rp.reduce(
          (s, p) => s + (counts[p.id][m.id]?.reviews || 0),
          0,
        );
        const active = rp.some((p) => counts[p.id][m.id]);
        if (!active) return "";
        return `<tr><td><span class="who"><i class="dot" style="background:${colorOf(m)}"></i>${esc(m.displayName || m.name)}</span></td>${cells}${cellHtml(totReviews, tot, " total")}</tr>`;
      })
      .join("");
    const sumReviews = (pid) =>
      members.reduce((s, m) => s + (counts[pid][m.id]?.reviews || 0), 0);
    const teamRow = rp
      .map((p) => cellHtml(sumReviews(p.id), teamPrs(p.id)))
      .join("");
    const teamTotal = cellHtml(
      rp.reduce((s, p) => s + sumReviews(p.id), 0),
      rp.reduce((s, p) => s + teamPrs(p.id), 0),
      " total",
    );
    const anyLive = rp.some((p) => p.inProgress);
    return `<section class="card">
      <h2>By sprint</h2>
      <p class="sub">Reviews each person submitted in the sprint, with distinct PRs beneath. 🥇🥈🥉 mark the top three${LAST ? ` and ${esc(LAST)} marks last` : ""}. Totals add each sprint's count.${anyLive ? " * In progress." : ""}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Member</th>${head}<th class="total">Total</th></tr></thead>
        <tbody>${rows}<tr class="team"><td>Team</td>${teamRow}${teamTotal}</tr></tbody>
      </table></div>
    </section>`;
  }

  function drawBars(container) {
    const rp = rangePeriods();
    const W = 560,
      H = 300,
      L = 40,
      R = 8,
      T = 16,
      B = 40;
    const svg = el("svg", {
      viewBox: `0 0 ${W} ${H}`,
      class: "chart",
      role: "img",
      "aria-label": "Grouped bar chart of reviews per sprint",
    });
    const vis = shown();
    const { max, ticks } = niceScale(
      Math.max(
        1,
        ...rp.flatMap((p) => vis.map((m) => counts[p.id][m.id]?.reviews || 0)),
      ),
    );
    const y = (v) => H - B - ((H - B - T) * v) / max;
    yAxis(svg, { x0: L, x1: W - R, y0: H - B, y1: T, max, ticks });
    const groupW = (W - L - R) / rp.length;
    const gap = 2;
    const slots = Math.max(1, vis.length);
    const inner = Math.min(groupW * 0.78, 30 * slots);
    const barW = (inner - gap * (slots - 1)) / slots;
    rp.forEach((p, gi) => {
      const gx = L + gi * groupW + (groupW - inner) / 2;
      vis.forEach((m, mi) => {
        const c = counts[p.id][m.id];
        if (!c) return;
        const x = gx + mi * (barW + gap);
        const yy = y(c.reviews);
        el(
          "path",
          { d: barPath(x, yy, barW, H - B - yy), fill: colorOf(m) },
          svg,
        );
        const hit = el(
          "rect",
          {
            x: x - gap / 2,
            y: T,
            width: barW + gap,
            height: H - B - T,
            class: "hit",
          },
          svg,
        );
        hit.addEventListener("mousemove", (e) =>
          showTip(
            e,
            `<div class="tt-title">${esc(p.name)}</div>${ttRows([{ name: m.displayName || m.name, color: colorOf(m), value: `${plural(c.reviews, "review", "reviews")} · ${plural(c.count, "PR", "PRs")}` }])}`,
          ),
        );
        hit.addEventListener("mouseleave", hideTip);
      });
      const t = el(
        "text",
        {
          x: L + gi * groupW + groupW / 2,
          y: H - B + 18,
          "text-anchor": "middle",
        },
        svg,
      );
      t.textContent = periodLabel(p) + (p.inProgress ? "*" : "");
      const d = el(
        "text",
        {
          x: L + gi * groupW + groupW / 2,
          y: H - B + 33,
          "text-anchor": "middle",
          class: "axis-label",
        },
        svg,
      );
      d.textContent = fmtDate(p.start);
    });
    container.appendChild(svg);
  }

  function drawTrend(container) {
    const rp = rangePeriods();
    const W = 560,
      H = 300,
      L = 40,
      R = 70,
      T = 16,
      B = 40;
    const svg = el("svg", {
      viewBox: `0 0 ${W} ${H}`,
      class: "chart",
      role: "img",
      "aria-label": "Line chart of reviews per sprint by member",
    });
    const vis = shown();
    const { max, ticks } = niceScale(
      Math.max(
        1,
        ...rp.flatMap((p) => vis.map((m) => counts[p.id][m.id]?.reviews || 0)),
      ),
    );
    const y = (v) => H - B - ((H - B - T) * v) / max;
    const x = (i) =>
      rp.length === 1
        ? (L + W - R) / 2
        : L + ((W - R - L) * i) / (rp.length - 1);
    yAxis(svg, { x0: L, x1: W - R, y0: H - B, y1: T, max, ticks });
    rp.forEach((p, i) => {
      const t = el(
        "text",
        { x: x(i), y: H - B + 18, "text-anchor": "middle" },
        svg,
      );
      t.textContent = periodLabel(p) + (p.inProgress ? "*" : "");
      const d = el(
        "text",
        {
          x: x(i),
          y: H - B + 33,
          "text-anchor": "middle",
          class: "axis-label",
        },
        svg,
      );
      d.textContent = fmtDate(p.start);
    });
    const ends = [];
    vis.forEach((m) => {
      const pts = rp.map((p, i) =>
        counts[p.id][m.id]
          ? [x(i), y(counts[p.id][m.id].reviews), counts[p.id][m.id].reviews]
          : null,
      );
      const segs = [];
      let cur = [];
      pts.forEach((pt) => {
        if (pt) cur.push(pt);
        else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      });
      if (cur.length) segs.push(cur);
      segs.forEach((s) => {
        if (s.length > 1)
          el(
            "path",
            {
              d: s.map((q, i) => `${i ? "L" : "M"}${q[0]},${q[1]}`).join(""),
              fill: "none",
              stroke: colorOf(m),
              "stroke-width": 2,
              "stroke-linejoin": "round",
              "stroke-linecap": "round",
            },
            svg,
          );
        s.forEach((q) =>
          el(
            "circle",
            {
              cx: q[0],
              cy: q[1],
              r: 4,
              fill: colorOf(m),
              stroke: "var(--surface-1)",
              "stroke-width": 2,
            },
            svg,
          ),
        );
      });
      const lastPt = pts.filter(Boolean).at(-1);
      if (lastPt) ends.push({ m, y: lastPt[1], x: lastPt[0] });
    });
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++)
      if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    ends.forEach((e) => {
      const t = el("text", { x: e.x + 10, y: e.y + 4, class: "direct" }, svg);
      t.textContent = memberLabel(e.m);
    });
    const hover = el(
      "line",
      { y1: T, y2: H - B, class: "hover-line", opacity: 0 },
      svg,
    );
    rp.forEach((p, i) => {
      const w = rp.length === 1 ? W - L - R : (W - R - L) / (rp.length - 1);
      const hit = el(
        "rect",
        { x: x(i) - w / 2, y: T, width: w, height: H - B - T, class: "hit" },
        svg,
      );
      hit.addEventListener("mousemove", (e) => {
        hover.setAttribute("x1", x(i));
        hover.setAttribute("x2", x(i));
        hover.setAttribute("opacity", 1);
        const rows = vis
          .filter((m) => counts[p.id][m.id])
          .map((m) => ({
            name: m.displayName || m.name,
            color: colorOf(m),
            value: counts[p.id][m.id].reviews,
          }))
          .sort((a, b) => b.value - a.value);
        showTip(e, `<div class="tt-title">${esc(p.name)}</div>${ttRows(rows)}`);
      });
      hit.addEventListener("mouseleave", () => {
        hover.setAttribute("opacity", 0);
        hideTip();
      });
    });
    container.appendChild(svg);
  }

  function drawRace(container) {
    const p = eff.find((x) => x.id === state.focus);
    if (!p) return;
    const trackEnd = Date.parse(displayEnd(p));
    const days = [];
    for (
      let d = Date.parse(new Date(p.start).toISOString().slice(0, 10));
      d < Math.max(trackEnd, Date.parse(p.end));
      d += 86400000
    )
      days.push(new Date(d).toISOString().slice(0, 10));
    const vis = shown();
    const daily = dailyCumulative(events, vis, p);
    const W = 1060,
      H = 300,
      L = 40,
      R = 90,
      T = 16,
      B = 34;
    const svg = el("svg", {
      viewBox: `0 0 ${W} ${H}`,
      class: "chart",
      role: "img",
      "aria-label": `Cumulative reviews per day in ${p.name}`,
    });
    const { max, ticks } = niceScale(
      Math.max(1, ...Object.values(daily).map((s) => s.at(-1)?.total || 0)),
    );
    const y = (v) => H - B - ((H - B - T) * v) / max;
    const x = (i) => L + ((W - R - L) * (i + 0.5)) / days.length;
    const dayW = (W - R - L) / days.length;
    days.forEach((d, i) => {
      const dow = new Date(`${d}T12:00:00Z`).getUTCDay();
      if (dow === 0 || dow === 6)
        el(
          "rect",
          {
            x: L + dayW * i,
            y: T,
            width: dayW,
            height: H - B - T,
            class: "weekend",
          },
          svg,
        );
    });
    yAxis(svg, { x0: L, x1: W - R, y0: H - B, y1: T, max, ticks });
    const every = days.length > 16 ? 2 : 1;
    days.forEach((d, i) => {
      if (i % every) return;
      const t = el(
        "text",
        {
          x: x(i),
          y: H - B + 18,
          "text-anchor": "middle",
          class: "axis-label",
        },
        svg,
      );
      t.textContent = fmtDate(`${d}T12:00:00Z`);
    });
    if (p.inProgress) {
      const ti = days.indexOf(now.toISOString().slice(0, 10));
      if (ti >= 0) {
        el(
          "line",
          { x1: x(ti), x2: x(ti), y1: T, y2: H - B, class: "today" },
          svg,
        );
        const t = el(
          "text",
          { x: x(ti), y: T - 4, "text-anchor": "middle", class: "axis-label" },
          svg,
        );
        t.textContent = "today";
      }
    }
    const ends = [];
    vis.forEach((m) => {
      const series = daily[m.id];
      if (!series) return;
      const byDay = Object.fromEntries(series.map((s) => [s.day, s.total]));
      const pts = days
        .map((d, i) => (d in byDay ? [x(i), y(byDay[d]), byDay[d]] : null))
        .filter(Boolean);
      if (!pts.length) return;
      const d = pts
        .map((q, i) => (i ? `H${q[0]}V${q[1]}` : `M${q[0]},${q[1]}`))
        .join("");
      el(
        "path",
        {
          d,
          fill: "none",
          stroke: colorOf(m),
          "stroke-width": 2,
          "stroke-linejoin": "round",
        },
        svg,
      );
      const lastPt = pts.at(-1);
      el(
        "circle",
        {
          cx: lastPt[0],
          cy: lastPt[1],
          r: 4,
          fill: colorOf(m),
          stroke: "var(--surface-1)",
          "stroke-width": 2,
        },
        svg,
      );
      ends.push({ m, x: lastPt[0], y: lastPt[1], v: lastPt[2] });
    });
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++)
      if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    ends.forEach((e) => {
      const t = el("text", { x: e.x + 10, y: e.y + 4, class: "direct" }, svg);
      t.textContent = `${memberLabel(e.m)} ${e.v}`;
    });
    const hover = el(
      "line",
      { y1: T, y2: H - B, class: "hover-line", opacity: 0 },
      svg,
    );
    const colW = (W - R - L) / days.length;
    days.forEach((d, i) => {
      const hit = el(
        "rect",
        { x: L + colW * i, y: T, width: colW, height: H - B - T, class: "hit" },
        svg,
      );
      hit.addEventListener("mousemove", (e) => {
        const rows = vis
          .filter((m) => daily[m.id])
          .map((m) => {
            const s = daily[m.id].find((q) => q.day === d);
            return s
              ? {
                  name: m.displayName || m.name,
                  color: colorOf(m),
                  value: s.total,
                }
              : null;
          })
          .filter(Boolean)
          .sort((a, b) => b.value - a.value);
        if (!rows.length) return hideTip();
        hover.setAttribute("x1", x(i));
        hover.setAttribute("x2", x(i));
        hover.setAttribute("opacity", 1);
        showTip(
          e,
          `<div class="tt-title">${esc(fmtDate(`${d}T12:00:00Z`, { weekday: "short", month: "short", day: "numeric" }))}</div>${ttRows(rows)}`,
        );
      });
      hit.addEventListener("mouseleave", () => {
        hover.setAttribute("opacity", 0);
        hideTip();
      });
    });
    container.appendChild(svg);
  }

  const REASONS = {
    "after-merge": "after merge",
    "inline-comment": "single comment",
  };

  function renderDrill() {
    const p = eff.find((x) => x.id === state.focus);
    if (!p) return "";
    const start = Date.parse(p.start),
      end = Date.parse(p.end);
    const excludedBy = {};
    for (const e of events) {
      const t = Date.parse(e.at);
      if (e.excluded && t >= start && t < end)
        (excludedBy[e.login] ||= []).push(e);
    }
    const ordered = members
      .filter((m) => counts[p.id][m.id])
      .sort((a, b) => counts[p.id][b.id].reviews - counts[p.id][a.id].reviews);
    const items = ordered
      .map((m) => {
        const c = counts[p.id][m.id];
        const prs = [...c.prs].sort(
          (a, b) => Date.parse(b.firstAt) - Date.parse(a.firstAt),
        );
        const li = prs
          .map(
            (
              pr,
            ) => `<li><span class="repo">${esc(pr.repo.replace(/^[^/]+\//, ""))}#${pr.pr}</span>
        <a class="title" href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.title)}</a>
        <span class="when tabular">${esc(fmtDateTime(pr.firstAt))}${pr.reviewAts.length > 1 ? `<span class="reason">${pr.reviewAts.length} reviews</span>` : ""}</span></li>`,
          )
          .join("");
        const ex = (excludedBy[m.github] || []).sort(
          (a, b) => Date.parse(b.at) - Date.parse(a.at),
        );
        const exLi = ex
          .map(
            (
              e,
            ) => `<li class="excluded"><span class="repo">${esc(e.repo.replace(/^[^/]+\//, ""))}#${e.pr}</span>
        <a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.prTitle)}</a>
        <span class="when tabular">${esc(fmtDateTime(e.at))}<span class="reason">${esc(REASONS[e.excluded] || e.excluded)}</span></span></li>`,
          )
          .join("");
        return `<details class="member" data-member="${esc(m.id)}"${openDrill.has(m.id) ? " open" : ""}><summary><i class="dot" style="background:${colorOf(m)}"></i><b>${esc(m.displayName || m.name)}</b>
        <span class="cnt tabular">${plural(c.reviews, "review", "reviews")} · ${plural(c.count, "PR", "PRs")}${ex.length ? ` · ${ex.length} not counted` : ""}</span></summary>
        <ul class="pr-list">${li || "<li>No reviews yet.</li>"}</ul>
        ${ex.length ? `<div class="subhead">Not counted</div><ul class="pr-list">${exLi}</ul>` : ""}</details>`;
      })
      .join("");
    return `<section class="card"><h2>Reviewed PRs · ${esc(p.name)}</h2>
      <p class="sub">Each PR with its first counted review in the sprint, and how many reviews when more than one. Greyed rows are activity that didn't count.</p>${items}</section>`;
  }

  const openDrill = new Set();
  let teamChanged = false;

  function render() {
    const app = document.getElementById("app");
    if (!teamChanged) {
      openDrill.clear();
      app
        .querySelectorAll("details.member[open]")
        .forEach((d) => openDrill.add(d.dataset.member));
    }
    teamChanged = false;
    const active = document.activeElement;
    const legendIndex = [...app.querySelectorAll(".legend-item")].indexOf(
      active,
    );
    const focusId = active?.id;
    const focus = eff.find((x) => x.id === state.focus);
    renderTopBar();
    app.innerHTML = `${renderHeader()}
      ${renderPodium()}
      ${focus ? `<section class="card"><div class="card-head"><h2>Sprint race · ${esc(focus.name)}</h2><a class="watch" href="${esc(raceHref)}${hashFor(team.id, focus.id)}">${ICON_PLAY}Watch the race</a></div><p class="sub">Cumulative reviews by day (UTC).</p>${legend("line")}<div id="race"></div></section>` : ""}
      ${renderDrill()}
      ${renderRangeHead()}
      <div class="grid">
        <section class="card"><h2>Reviews per sprint</h2><p class="sub">Reviews submitted, last ${state.n} ${state.n === 1 ? "sprint" : "sprints"}.</p>${legend("swatch")}<div id="bars"></div></section>
        <section class="card"><h2>Trend</h2><p class="sub">Each person's count across sprints.</p>${legend("line")}<div id="trend"></div></section>
      </div>
      ${renderTable()}
      <footer>
        <div class="how" id="how">${ICON_INFO}<div>
          <p><b>How it's counted.</b> A review is an Approve, Request changes, or Comment review submitted on someone else's PR in ${esc(team.githubOrg)} before it merged. Every review counts, including a second review on the same PR, and each counts in the sprint it was submitted.</p>
          <p>Standalone inline comments and replies in code threads don't count, and neither do comments in the conversation tab. GitHub records a standalone comment as a Comment review with no summary and one inline comment, so a submitted Comment review with no summary and only one inline comment is missed too. Distinct PRs reviewed show as the smaller number.</p>
          <p>Sprints run from their Jira start to the next sprint's start.</p>
        </div></div>
        <p class="built">${ICON_CAL}Built ${esc(fmtDateTime(DATA.builtAt))}</p>
      </footer>`;
    if (eff.length) {
      drawBars(document.getElementById("bars"));
      drawTrend(document.getElementById("trend"));
    }
    if (focus) drawRace(document.getElementById("race"));
    document.getElementById("ctl-n")?.addEventListener("change", (e) => {
      state.n = Number(e.target.value);
      store.set({ n: state.n });
      render();
    });
    document.getElementById("ctl-focus")?.addEventListener("change", (e) => {
      state.focus = e.target.value;
      writeHash();
      render();
    });
    app.querySelectorAll(".legend-item").forEach((b) =>
      b.addEventListener("click", () => {
        const id = b.dataset.member;
        if (state.hidden.has(id)) state.hidden.delete(id);
        else state.hidden.add(id);
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      }),
    );
    const target =
      legendIndex >= 0
        ? app.querySelectorAll(".legend-item")[legendIndex]
        : focusId
          ? document.getElementById(focusId)
          : null;
    target?.focus({ preventScroll: true });
  }

  function fromHash() {
    const { team: t, periodId } = resolveSelection(
      DATA.teams,
      parseHash(location.hash),
      store.get().team,
    );
    return { t, periodId };
  }

  window.addEventListener("hashchange", () => {
    const { t, periodId } = fromHash();
    if (!t || (t.id === team?.id && (!periodId || periodId === state.focus)))
      return;
    if (t.id === team.id) state.focus = periodId;
    else selectTeam(t, periodId);
    render();
  });

  applyColorMode(state.mode);
  const initial = fromHash();
  if (!initial.t) {
    document.getElementById("app").innerHTML =
      '<p class="page-sub">No teams are configured yet. Add one to config/teams.json and rebuild.</p>';
    return;
  }
  selectTeam(initial.t, initial.periodId);
  render();
})();

</script>
</body>
</html>
